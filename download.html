<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparing Download</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:Arial,sans-serif;
background:#000;
}

video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
z-index:-1;
}

.box{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:380px;
padding:25px;
border-radius:20px;
background:rgba(0,0,0,.55);
backdrop-filter:blur(12px);
border:2px solid #00ff66;
text-align:center;
color:#fff;
box-shadow:0 0 30px #00ff66;
}

h2{
color:#00ff66;
margin-bottom:15px;
}

#count{
font-size:70px;
font-weight:bold;
color:#00ff66;
text-shadow:0 0 20px #00ff66;
}

p{
margin-top:15px;
font-size:18px;
}
 #readyBtn{
display:none;
margin:25px auto 0;
padding:15px 30px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:50px;
background:linear-gradient(45deg,#00ff66,#00ccff);
color:#000;
cursor:pointer;
box-shadow:0 0 20px #00ff66;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
  } 
</style>

</head>

<body>

<video autoplay muted loop playsinline>
<source src="bgvideo.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="box">

<h2>Preparing Access...</h2>

<div id="count">25</div>

<p>Please Wait...</p>
  <button id="readyBtn" onclick="openVideo()">
YOUR LINK IS READY
  </button>

</div>

<script>

let sec=20;

let timer=setInterval(function(){

sec--;

document.getElementById("count").innerHTML=sec;

if(sec==0){

clearInterval(timer);

document.getElementById("count").style.display="none";

document.querySelector("p").innerHTML="Click the button below";

document.getElementById("readyBtn").style.display="inline-block";

  }

},1000);
function openVideo(){

window.location.href="https://youtube.com/yourvideolink";

  }
</script>

</body>
</html>
