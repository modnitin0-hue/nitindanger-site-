        /* ===== CHESS CINEMATIC + EXTRA FEATURES ===== */

#chess-cinematic {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: transparent;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.4s ease, visibility 0s linear 1.4s;
}
#chess-cinematic.hide {
    opacity: 0;
    visibility: hidden;
}

#cinematic-title {
    position: absolute;
    left: 50%;
    top: 12%;
    transform: translateX(-50%);
    font-size: clamp(24px, 6vw, 54px);
    font-weight: 900;
    letter-spacing: 5px;
    color: #f5e6b3;
    text-shadow: 0 4px 20px #000;
    opacity: 0;
    transition: opacity 1s ease;
}

#cinematic-title.show {
    opacity: 1;
}

.cinematic-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at center,
            transparent 20%,
            rgba(0,0,0,.25) 55%,
            rgba(0,0,0,.92) 100%);
}

.last-move-mark {
    position: absolute;
    pointer-events: none;
}

.king-check-ring {
    border-radius: 50%;
    border: 2px solid #ff4d4d;
    box-shadow:
        0 0 10px #ff3030,
        0 0 25px rgba(255,40,40,.8);
    animation: kingCheckPulse .7s infinite alternate;
}

@keyframes kingCheckPulse {
    from { opacity:.35; transform:scale(.85); }
    to   { opacity:1; transform:scale(1.15); }
}

#undo-btn {
    margin-top: 5px;
    width: 100%;
}
/* =====================================================
   CHESS BATTLE FX
===================================================== */

#battle-fx {
    position: fixed;
    inset: 0;
    z-index: 10000;
    pointer-events: none;
    overflow: hidden;
}

.battle-fx-text {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%) scale(.5);
    font-weight: 1000;
    font-size: clamp(24px, 7vw, 64px);
    letter-spacing: 3px;
    color: #fff;
    text-shadow:
        0 0 8px #000,
        0 0 22px currentColor,
        0 0 45px currentColor;
    opacity: 0;
    animation: battleTextPop .9s ease-out forwards;
    white-space: nowrap;
}

@keyframes battleTextPop {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.45)
            rotate(-4deg);
    }

    25% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.12)
            rotate(2deg);
    }

    65% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(1.25);
    }
}

.capture-shockwave {
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,.9);
    transform: translate(-50%, -50%) scale(.2);
    opacity: 1;
    animation: captureWave .65s ease-out forwards;
}

@keyframes captureWave {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.2);
        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(4);
        opacity: 0;
    }
}

.capture-flash {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,.65);
    transform: translate(-50%, -50%) scale(.2);
    opacity: 0;
    animation: captureFlash .35s ease-out forwards;
    filter: blur(4px);
}

@keyframes captureFlash {

    0% {
        opacity: .9;
        transform:
            translate(-50%, -50%)
            scale(.2);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(2.4);
    }
}

.check-warning {
    position: fixed;
    left: 50%;
    top: 28%;
    transform: translate(-50%, -50%);
    font-size: clamp(22px, 6vw, 48px);
    font-weight: 1000;
    letter-spacing: 4px;
    color: #ff3b3b;
    text-shadow:
        0 0 10px #ff0000,
        0 0 30px #ff0000;
    animation: checkWarning .8s ease-out forwards;
}

@keyframes checkWarning {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.6);
    }

    25% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.12);
    }

    70% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    100% {
        opacity: 0;
    }
}

/* =========================================
   JUNGLE VICTORY / DEFEAT CINEMATIC

========================================= */

#jungle-cinematic {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    overflow: hidden;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    color: white;
    background:
        linear-gradient(
            180deg,
            rgba(3,15,8,.35),
            rgba(0,0,0,.96)
        );
}

#jungle-cinematic.show {
    display: flex;
    animation: jungleFadeIn .7s ease forwards;
}

#jungle-cinematic::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(100,180,80,.35),
            transparent 55%
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0 45px,
            rgba(0,0,0,.35) 46px 60px
        );
    animation: jungleMist 4s ease-in-out infinite alternate;
}

#jungle-cinematic.defeat::before {
    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(150,20,15,.30),
            transparent 55%
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0 45px,
            rgba(0,0,0,.5) 46px 60px
        );
}

.jc-content {
    position: relative;
    z-index: 2;
    padding: 20px;
    animation: jcZoom 3.4s ease forwards;
}

.jc-icon {
    font-size: clamp(65px, 17vw, 120px);
    filter: drop-shadow(0 0 25px rgba(150,255,120,.6));
    animation: jcFloat 2s ease-in-out infinite;
}

.jc-title {
    font-size: clamp(32px, 9vw, 58px);
    font-weight: 1000;
    letter-spacing: 5px;
    margin: 15px 0;
    color: #b8ff83;
    text-shadow: 0 0 25px #35ff48;
}

#jungle-cinematic.defeat .jc-title {
    color: #ff6565;
    text-shadow: 0 0 25px red;
}

.jc-subtitle {
    font-size: 14px;
    letter-spacing: 3px;
    color: #eee;
}

.jc-ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 30%;
    background: linear-gradient(
        0deg,
        #020904,
        rgba(4,35,15,.85),
        transparent
    );
}

.jc-lightning {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
}

#jungle-cinematic.defeat .jc-lightning {
    animation: jcLightning 3s infinite;
}

@keyframes jungleFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes jungleMist {
    from { transform: translateX(-12px); }
    to { transform: translateX(12px); }
}

@keyframes jcZoom {
    from { transform: scale(.75); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes jcFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes jcLightning {
    0%,80%,84%,100% { opacity: 0; }
    82% { opacity: .22; }
}

        // --- 1. SOUND ENGINE (Web Audio API) ---
        // =====================================================
// SOUND ENGINE
// =====================================================

class SoundEngine {

    constructor() {

        this.ctx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    playTone(
        freq,
        duration,
        type = 'sine',
        volume = 0.3
    ) {

        if (!this.ctx) return;

        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }

        const osc =
            this.ctx.createOscillator();

        const gain =
            this.ctx.createGain();

        osc.type = type;

        osc.frequency.setValueAtTime(
            freq,
            this.ctx.currentTime
        );

        gain.gain.setValueAtTime(
            volume,
            this.ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            this.ctx.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();

        osc.stop(
            this.ctx.currentTime + duration
        );
    }


    playMove() {

        this.playTone(
            330,
            0.10,
            'triangle',
            0.22
        );

        setTimeout(() => {

            this.playTone(
                440,
                0.08,
                'triangle',
                0.16
            );

        }, 55);
    }


    playCapture() {

        this.playTone(
            120,
            0.12,
            'sawtooth',
            0.22
        );

        setTimeout(() => {

            this.playTone(
                75,
                0.18,
                'square',
                0.14
            );

        }, 60);
    }


    playQueenCapture() {

        this.playTone(
            180,
            0.10,
            'sawtooth',
            0.25
        );

        setTimeout(() => {

            this.playTone(
                420,
                0.13,
                'triangle',
                0.24
            );

        }, 90);

        setTimeout(() => {

            this.playTone(
                620,
                0.22,
                'sine',
                0.20
            );

        }, 170);
    }


    playCheck() {

        this.playTone(
            520,
            0.12,
            'square',
            0.18
        );

        setTimeout(() => {

            this.playTone(
                380,
                0.18,
                'square',
                0.14
            );

        }, 110);
    }


    playWin() {

        this.playTone(
            400,
            0.10,
            'sine',
            0.25
        );

        setTimeout(() => {

            this.playTone(
                600,
                0.18,
                'sine',
                0.25
            );

        }, 120);

        setTimeout(() => {

            this.playTone(
                800,
                0.30,
                'sine',
                0.22
            );

        }, 250);
    }
}

        // --- 2. LOGIC ENGINE (Chess Engine) ---
        // --- 2. LOGIC ENGINE (Chess Engine) ---
class ChessEngine {

    constructor() {
        this.reset();
    }

    reset() {
        this.board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['.','.','.','.','.','.','.','.'],
            ['.','.','.','.','.','.','.','.'],
            ['.','.','.','.','.','.','.','.'],
            ['.','.','.','.','.','.','.','.'],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        this.turn = 'w';
        this.history = [];
        this.moveStack = [];
        this.lastMove = null;
        this.enPassant = null;
        this.halfmoveClock = 0;

        this.castling = {
            wK: true,
            wQ: true,
            bK: true,
            bQ: true
        };
    }

    isWhite(p) {
        return p !== '.' && p === p.toUpperCase();
    }

    isBlack(p) {
        return p !== '.' && p === p.toLowerCase();
    }

    getPiece(r, c) {
        if (r < 0 || r > 7 || c < 0 || c > 7) return null;
        return this.board[r][c];
    }

    cloneBoard(board) {
        return board.map(row => [...row]);
    }

    /* =====================================================
       ATTACK CHECK
    ===================================================== */

    isSquareAttacked(r, c, byColor, board) {

        const enemyWhite = byColor === 'w';

        // Pawn attacks
        const pawnRow = enemyWhite ? r + 1 : r - 1;

        if (pawnRow >= 0 && pawnRow <= 7) {

            for (const dc of [-1, 1]) {

                const cc = c + dc;

                if (cc >= 0 && cc <= 7) {

                    const p = board[pawnRow][cc];

                    if (
                        p !== '.' &&
                        (
                            enemyWhite
                            ? p === 'P'
                            : p === 'p'
                        )
                    ) {
                        return true;
                    }
                }
            }
        }

        // Knight attacks
        const knight = enemyWhite ? 'N' : 'n';

        const knightOffsets = [
            [-2,-1],[-2,1],
            [-1,-2],[-1,2],
            [1,-2],[1,2],
            [2,-1],[2,1]
        ];

        for (const [dr, dc] of knightOffsets) {

            const rr = r + dr;
            const cc = c + dc;

            if (
                rr >= 0 && rr <= 7 &&
                cc >= 0 && cc <= 7 &&
                board[rr][cc] === knight
            ) {
                return true;
            }
        }

        // King attacks
        const king = enemyWhite ? 'K' : 'k';

        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {

                if (dr === 0 && dc === 0) continue;

                const rr = r + dr;
                const cc = c + dc;

                if (
                    rr >= 0 && rr <= 7 &&
                    cc >= 0 && cc <= 7 &&
                    board[rr][cc] === king
                ) {
                    return true;
                }
            }
        }

        // Sliding pieces
        const bishop = enemyWhite ? 'B' : 'b';
        const rook = enemyWhite ? 'R' : 'r';
        const queen = enemyWhite ? 'Q' : 'q';

        // Bishop / Queen diagonals
        const diagonalDirs = [
            [-1,-1],[-1,1],
            [1,-1],[1,1]
        ];

        for (const [dr, dc] of diagonalDirs) {

            let rr = r + dr;
            let cc = c + dc;

            while (
                rr >= 0 && rr <= 7 &&
                cc >= 0 && cc <= 7
            ) {

                const p = board[rr][cc];

                if (p !== '.') {

                    if (p === bishop || p === queen) {
                        return true;
                    }

                    break;
                }

                rr += dr;
                cc += dc;
            }
        }

        // Rook / Queen straight lines
        const straightDirs = [
            [-1,0],[1,0],
            [0,-1],[0,1]
        ];

        for (const [dr, dc] of straightDirs) {

            let rr = r + dr;
            let cc = c + dc;

            while (
                rr >= 0 && rr <= 7 &&
                cc >= 0 && cc <= 7
            ) {

                const p = board[rr][cc];

                if (p !== '.') {

                    if (p === rook || p === queen) {
                        return true;
                    }

                    break;
                }

                rr += dr;
                cc += dc;
            }
        }

        return false;
    }

    /* =====================================================
       KING CHECK
    ===================================================== */

    isKingInCheck(color, board) {

        const king = color === 'w' ? 'K' : 'k';

        let kr = -1;
        let kc = -1;

        for (let r = 0; r < 8; r++) {

            for (let c = 0; c < 8; c++) {

                if (board[r][c] === king) {
                    kr = r;
                    kc = c;
                    break;
                }
            }

            if (kr !== -1) break;
        }

        if (kr === -1) return false;

        const enemy = color === 'w' ? 'b' : 'w';

        return this.isSquareAttacked(
            kr,
            kc,
            enemy,
            board
        );

    /* =====================================================
       NORMAL PSEUDO MOVES
       NO CASTLING HERE
    ===================================================== */

    getPseudoMovesWithoutCastle(r, c, board) {

        const p = board[r][c];

        if (p === '.') return [];

        const type = p.toLowerCase();
        const isW = this.isWhite(p);

        const moves = [];

        const addMove = (tr, tc, flags = {}) => {

            if (
                tr < 0 || tr > 7 ||
                tc < 0 || tc > 7
            ) return;

            const target = board[tr][tc];

            if (
                target === '.' ||
                (isW
                    ? this.isBlack(target)
                    : this.isWhite(target))
            ) {

                moves.push({
                    from: { r, c },
                    to: { r: tr, c: tc },
                    piece: p,
                    ...flags
                });
            }
        };

        /* PAWN */
        if (type === 'p') {

            const dir = isW ? -1 : 1;
            const startRow = isW ? 6 : 1;

            const oneRow = r + dir;

            // Forward
            if (
                oneRow >= 0 &&
                oneRow <= 7 &&
                board[oneRow][c] === '.'
            ) {

                if (oneRow === 0 || oneRow === 7) {

                    addMove(oneRow, c, {
                        promo: true
                    });

                } else {

                    addMove(oneRow, c);

                    const twoRow = r + dir * 2;

                    if (
                        r === startRow &&
                        board[twoRow][c] === '.'
                    ) {
                        addMove(twoRow, c);
                    }
                }
            }

            // Captures + en passant
            for (const dc of [-1, 1]) {

                const tr = r + dir;
                const tc = c + dc;

                if (
                    tr < 0 || tr > 7 ||
                    tc < 0 || tc > 7
                ) continue;

                const target = board[tr][tc];

                // Normal capture
                if (
                    target !== '.' &&
                    (
                        isW
                        ? this.isBlack(target)
                        : this.isWhite(target)
                    )
                ) {

                    addMove(
                        tr,
                        tc,
                        tr === 0 || tr === 7
                            ? { promo: true }
                            : {}
                    );
                }

                // En passant
                if (
                    target === '.' &&
                    this.enPassant &&
                    this.enPassant.r === tr &&
                    this.enPassant.c === tc
                ) {

                    addMove(tr, tc, {
                        enPassant: true
                    });
                }
            }
        }

        /* KNIGHT */
        else if (type === 'n') {

            const offsets = [
                [-2,-1],[-2,1],
                [-1,-2],[-1,2],
                [1,-2],[1,2],
                [2,-1],[2,1]
            ];

            for (const [dr, dc] of offsets) {
                addMove(r + dr, c + dc);
            }
        }

        /* BISHOP / ROOK / QUEEN */
        else if (
            type === 'b' ||
            type === 'r' ||
            type === 'q'
        ) {

            const dirs = [];

            if (type === 'b' || type === 'q') {

                dirs.push(
                    [-1,-1],
                    [-1,1],
                    [1,-1],
                    [1,1]
                );
            }

            if (type === 'r' || type === 'q') {

                dirs.push(
                    [-1,0],
                    [1,0],
                    [0,-1],
                    [0,1]
                );
            }

            for (const [dr, dc] of dirs) {

                let tr = r + dr;
                let tc = c + dc;

                while (
                    tr >= 0 && tr <= 7 &&
                    tc >= 0 && tc <= 7
                ) {

                    const target = board[tr][tc];

                    if (target === '.') {

                        moves.push({
                            from: { r, c },
                            to: { r: tr, c: tc },
                            piece: p
                        });

                    } else {

                        if (
                            isW
                            ? this.isBlack(target)
                            : this.isWhite(target)
                        ) {

                            moves.push({
                                from: { r, c },
                                to: { r: tr, c: tc },
                                piece: p
                            });
                        }

                        break;
                    }

                    tr += dr;
                    tc += dc;
                }
            }
        }

        /* KING */
        else if (type === 'k') {

            for (let dr = -1; dr <= 1; dr++) {

                for (let dc = -1; dc <= 1; dc++) {

                    if (dr === 0 && dc === 0) continue;

                    addMove(
                        r + dr,
                        c + dc
                    );
                }
            }
        }

        return moves;
    }

    /* =====================================================

    getPseudoMoves(r, c, board) {

        if (p === '.') return [];

        const moves =
            this.getPseudoMovesWithoutCastle(
                r,
                c,
                board

        if (p.toLowerCase() !== 'k') {
            return moves;

        const isW = this.isWhite(p);
        const color = isW ? 'w' : 'b';

        /* WHITE CASTLING */

        if (
            isW &&
            r === 7 &&
            c === 4
        ) {

            // King side
            if (
                this.castling.wK &&
                board[7][5] === '.' &&
                board[7][6] === '.' &&
                board[7][7] === 'R' &&
                !this.isKingInCheck('w', board) &&
                !this.isSquareAttacked(
                    7, 5, 'b', board

                !this.isSquareAttacked(
                    7, 6, 'b', board

                moves.push({
                    from: { r: 7, c: 4 },
                    to: { r: 7, c: 6 },
                    piece: 'K',
                    castle: 'K'

            }

            // Queen side
            if (
                this.castling.wQ &&
                board[7][1] === '.' &&
                board[7][2] === '.' &&
                board[7][3] === '.' &&
                board[7][0] === 'R' &&
                !this.isKingInCheck('w', board) &&
                !this.isSquareAttacked(
                    7, 3, 'b', board
                ) &&
                !this.isSquareAttacked(
                    7, 2, 'b', board

            ) {

                moves.push({
                    from: { r: 7, c: 4 },
                    to: { r: 7, c: 2 },
                    piece: 'K',
                    castle: 'Q'

            }
        }

        /* BLACK CASTLING */

        if (
            !isW &&
            r === 0 &&
            c === 4
        ) {

            // King side
            if (
                this.castling.bK &&
                board[0][5] === '.' &&
                board[0][6] === '.' &&
                board[0][7] === 'r' &&
                !this.isKingInCheck('b', board) &&
                !this.isSquareAttacked(
                    0, 5, 'w', board
                ) &&
                !this.isSquareAttacked(
                    0, 6, 'w', board
                )
            ) {

                moves.push({
                    from: { r: 0, c: 4 },
                    to: { r: 0, c: 6 },
                    piece: 'k',
                    castle: 'K'
                });
            }

            // Queen side
            if (
                this.castling.bQ &&
                board[0][1] === '.' &&
                board[0][2] === '.' &&
                board[0][3] === '.' &&
                board[0][0] === 'r' &&
                !this.isKingInCheck('b', board) &&
                !this.isSquareAttacked(
                    0, 3, 'w', board
                ) &&
                !this.isSquareAttacked(
                    0, 2, 'w', board
                )
            ) {

                moves.push({
                    from: { r: 0, c: 4 },
                    to: { r: 0, c: 2 },
                    piece: 'k',
                    castle: 'Q'

            }
        }

        return moves;
    }

    /* =====================================================
       LEGAL MOVES
    ===================================================== */

    getValidMoves(r, c) {

        const piece = this.getPiece(r, c);

        if (
            piece === '.' ||
            (this.turn === 'w' && !this.isWhite(piece)) ||
            (this.turn === 'b' && !this.isBlack(piece))
        ) {
            return [];
        }

        const pseudoMoves =
            this.getPseudoMoves(
                r,
                c,
                this.board
            );

        return pseudoMoves.filter(move => {

            const simBoard =
                this.cloneBoard(this.board);

            this.applyMoveToBoard(
                simBoard,
                move
            );

            return !this.isKingInCheck(
                this.turn,
                simBoard
            );
        });
    }

    getAllLegalMoves(color) {

        const oldTurn = this.turn;

        this.turn = color;

        const all = [];

        for (let r = 0; r < 8; r++) {

            for (let c = 0; c < 8; c++) {

                const p = this.board[r][c];

                if (
                    p !== '.' &&
                    (
                        (color === 'w' && this.isWhite(p)) ||
                        (color === 'b' && this.isBlack(p))
                    )
                ) {

                    all.push(
                        ...this.getValidMoves(r, c)
                    );
                }
            }
        }

        this.turn = oldTurn;

        return all;
    }

    /* =====================================================
       APPLY MOVE TO BOARD
    ===================================================== */

    applyMoveToBoard(board, move) {

        let p =
            board[move.from.r][move.from.c];

        // En passant capture
        if (move.enPassant) {

            const captureRow =
                this.isWhite(p)
                    ? move.to.r + 1
                    : move.to.r - 1;

            board[captureRow][move.to.c] = '.';
        }

        // Promotion
        if (move.promotedTo) {

            p = this.isWhite(p)
                ? move.promotedTo.toUpperCase()
                : move.promotedTo.toLowerCase();
        }

        board[move.from.r][move.from.c] = '.';

        board[move.to.r][move.to.c] = p;

        // Castle rook
        if (move.castle) {

            if (move.to.c === 6) {

                board[move.to.r][5] =
                    board[move.to.r][7];

                board[move.to.r][7] = '.';

            } else if (move.to.c === 2) {

                board[move.to.r][3] =
                    board[move.to.r][0];

                board[move.to.r][0] = '.';
            }
        }
    }

    /* =====================================================
       MAKE MOVE
    ===================================================== */

makeMove(move) {

    const piece = this.board[move.from.r][move.from.c];

    let captured = move.enPassant
        ? this.board[move.from.r][move.to.c]
        : this.board[move.to.r][move.to.c];

    // Save complete state for undo
    this.moveStack.push({
        board: this.cloneBoard(this.board),
        turn: this.turn,
        history: [...this.history],
        lastMove: this.lastMove ? {
            from: { ...this.lastMove.from },
            to: { ...this.lastMove.to }
        } : null,
        enPassant: this.enPassant ? { ...this.enPassant } : null,
        castling: { ...this.castling },
        halfmoveClock: this.halfmoveClock
    });

    // Update castling rights when king moves
    if (piece === 'K') {
        this.castling.wK = false;
        this.castling.wQ = false;
    }

    if (piece === 'k') {
        this.castling.bK = false;
        this.castling.bQ = false;
    }

    // Update castling rights when rook moves
    if (piece === 'R') {
        if (move.from.r === 7 && move.from.c === 0) this.castling.wQ = false;
        if (move.from.r === 7 && move.from.c === 7) this.castling.wK = false;
    }

    if (piece === 'r') {
        if (move.from.r === 0 && move.from.c === 0) this.castling.bQ = false;
        if (move.from.r === 0 && move.from.c === 7) this.castling.bK = false;
    }

    // Update castling rights when rook is captured
    if (captured === 'R') {
        if (move.to.r === 7 && move.to.c === 0) this.castling.wQ = false;
        if (move.to.r === 7 && move.to.c === 7) this.castling.wK = false;
    }

    if (captured === 'r') {
        if (move.to.r === 0 && move.to.c === 0) this.castling.bQ = false;
        if (move.to.r === 0 && move.to.c === 7) this.castling.bK = false;
    }

    // En passant target reset
    this.enPassant = null;

    // Set en passant target after a two-square pawn move
    if (
        piece.toLowerCase() === 'p' &&
        Math.abs(move.to.r - move.from.r) === 2
    ) {
        this.enPassant = {
            r: (move.from.r + move.to.r) / 2,
            c: move.from.c
        };
    }

    // Halfmove clock
    if (piece.toLowerCase() === 'p' || captured !== '.') {
        this.halfmoveClock = 0;
    } else {
        this.halfmoveClock++;
    }

    // Apply actual move
    this.applyMoveToBoard(this.board, move);

    this.turn = this.turn === 'w' ? 'b' : 'w';

    const cols = ['a','b','c','d','e','f','g','h'];

    const str =
        `${piece.toUpperCase()}:` +
        `${cols[move.from.c]}${8 - move.from.r}` +
        `→` +
        `${cols[move.to.c]}${8 - move.to.r}`;

    this.history.push(str);

    this.lastMove = {
        from: { ...move.from },
        to: { ...move.to }
    };

    return captured !== '.';
}

undoMove() {

    if (!this.moveStack || this.moveStack.length === 0) {
        return false;
    }

    const state = this.moveStack.pop();

    this.board = state.board;
    this.turn = state.turn;
    this.history = [...state.history];

    this.lastMove = state.lastMove
        ? {
            from: { ...state.lastMove.from },
            to: { ...state.lastMove.to }
        }
        : null;

    this.enPassant = state.enPassant
        ? { ...state.enPassant }
        : null;

    this.castling = { ...state.castling };

    this.halfmoveClock = state.halfmoveClock;

    return true;
}

            beta = Math.min(beta, ev);

            if (beta <= alpha) break;
        }

        return minEval;
    }

            const tower = new THREE.Group();

            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.85,
                    1.0,
                    2.8,
                    12
                ),
                stoneMat
            );

            body.position.y = 1.05;
            tower.add(body);

            const top = new THREE.Mesh(
                new THREE.CylinderGeometry(
                    1.05,
                    1.05,
                    0.35,
                    12
                ),
                darkMat
            );

            top.position.y = 2.55;
            tower.add(top);

            // Battlements
            for (let i = 0; i < 8; i++) {

                const a =
                    (i / 8) *
                    Math.PI *
                    2;

                const block = new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.22,
                        0.45,
                        0.22
                    ),
                    stoneMat
                );

                block.position.set(
                    Math.cos(a) * 0.82,
                    2.9,
                    Math.sin(a) * 0.82
                );

                tower.add(block);
            }

            tower.position.set(x, 0, z);
            castle.add(tower);
        });


        // Four connecting walls
        const wallData = [
            [0, 0.85, -5.35, 9.0, 1.7, 0.35],
            [0, 0.85,  5.35, 9.0, 1.7, 0.35],
            [-5.35, 0.85, 0, 0.35, 1.7, 9.0],
            [ 5.35, 0.85, 0, 0.35, 1.7, 9.0]
        ];

        wallData.forEach(data => {

            const wall = new THREE.Mesh(
                new THREE.BoxGeometry(
                    data[3],
                    data[4],
                    data[5]
                ),
                stoneMat
            );

            wall.position.set(
                data[0],
                data[1],
                data[2]
            );

            castle.add(wall);
        });


        // Entrance arch / gate
        const gateFrame = new THREE.Mesh(
            new THREE.BoxGeometry(
                2.5,
                2.6,
                0.45
            ),
            darkMat
        );

        gateFrame.position.set(
            0,
            1.0,
            -5.45
        );

        castle.add(gateFrame);


        this.scene.add(castle);

        this.cinematicCastle = castle;
        this.cinematicCastle.visible = true;
    }


    // =====================================================
    // OPENING CINEMATIC
    // =====================================================

    playOpeningCinematic() {

        if (this.cinematicRunning) {
            return;
        }

        this.cinematicRunning = true;

        const overlay =
            document.getElementById(
                'chess-cinematic'
            );

        const title =
            document.getElementById(
                'cinematic-title'
            );

        if (this.controls) {
            this.controls.enabled = false;
        }

        if (overlay) {
            overlay.classList.remove('hide');
            overlay.style.visibility = 'visible';
            overlay.style.opacity = '1';
        }

        if (title) {
            title.classList.remove('show');

            setTimeout(() => {
                if (this.cinematicRunning) {
                    title.classList.add('show');
                }
            }, 300);
        }


        // Hide normal board
        if (this.boardGroup) {
            this.boardGroup.visible = false;
        }

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {

                if (this.pieces3D[r][c]) {
                    this.pieces3D[r][c].visible = false;
                }
            }
        }


        // Remove previous cinematic pieces
        if (this.cinematicPieces.length) {

            this.cinematicPieces.forEach(item => {

                if (item && item.mesh) {
                    this.scene.remove(item.mesh);
                }

            });
        }

        this.cinematicPieces = [];


        // Camera cinematic start
        this.camera.position.set(
            0,
            4.8,
            -15
        );

        this.camera.lookAt(
            0,
            0,
            0
        );


        const startingBoard = [

            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['.','.','.','.','.','.','.','.'],
            ['.','.','.','.','.','.','.','.'],
            ['.','.','.','.','.','.','.','.'],
            ['.','.','.','.','.','.','.','.'],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']

        ];


        // Create cinematic pieces
        for (let r = 0; r < 8; r++) {

            for (let c = 0; c < 8; c++) {

                const char = startingBoard[r][c];

                if (char === '.') {
                    continue;
                }

                const isWhite =
                    char === char.toUpperCase();

                const mesh =
                    this.buildPieceMesh(
                        char.toLowerCase(),
                        isWhite
                    );

                mesh.position.set(
                    (c - 3.5) * 0.7,
                    0.4,
                    -7
                );

                mesh.scale.setScalar(0.95);

                this.scene.add(mesh);

                this.cinematicPieces.push({

                    mesh: mesh,

                    targetX:
                        c - 3.5,

                    targetZ:
                        r - 3.5,

                    delay:
                        isWhite
                            ? 850 + (7 - r) * 180 + c * 65
                            : 250 + r * 180 + c * 65

                });
            }
        }


        const startTime =
            performance.now();

        const totalDuration = 6000;

        const animateCinematic = now => {

            if (!this.cinematicRunning) {
                return;
            }

            const elapsed =
                now - startTime;


            // -----------------------------
            // PIECES
            // -----------------------------

            this.cinematicPieces.forEach(item => {

                const progress =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            (elapsed - item.delay) / 1400
                        )
                    );

                if (progress <= 0) {
                    return;
                }

                const ease =
                    progress *
                    progress *
                    (3 - 2 * progress);


                item.mesh.position.x =
                    (item.targetX * ease);

                item.mesh.position.z =
                    -7 +
                    (
                        item.targetZ + 7
                    ) * ease;

                item.mesh.position.y =
                    0.12 +
                    Math.sin(
                        ease * Math.PI
                    ) * 1.15;

                item.mesh.rotation.y =
                    Math.sin(
                        ease * Math.PI * 2
                    ) * 0.25;


                if (progress >= 1) {

                    item.mesh.position.x =
                        item.targetX;

                    item.mesh.position.y =
                        0.05;

                    item.mesh.position.z =
                        item.targetZ;

                    item.mesh.rotation.set(
                        0,
                        0,
                        0
                    );
                }

            });


            // -----------------------------
            // CAMERA
            // -----------------------------

            const cp =
                Math.min(
                    1,
                    elapsed / totalDuration
                );

            const ce =
                cp * cp * (3 - 2 * cp);

            this.camera.position.z =
                -15 + ce * 24;

            this.camera.position.y =
                4.8 - ce * 2.0;

            this.camera.lookAt(
                0,
                0,
                0
            );


            if (elapsed < totalDuration) {

                requestAnimationFrame(
                    animateCinematic
                );

            } else {

                this.finishOpeningCinematic();
            }
        };


        requestAnimationFrame(
            animateCinematic
        );
    }


    // =====================================================
    // FINISH CINEMATIC
    // =====================================================

    finishOpeningCinematic() {

        this.cinematicRunning = false;

        if (this.cinematicTimer) {
            clearTimeout(this.cinematicTimer);
            this.cinematicTimer = null;
        }


        // Remove cinematic pieces
        this.cinematicPieces.forEach(item => {

            if (item && item.mesh) {
                this.scene.remove(item.mesh);
            }

        });

        this.cinematicPieces = [];


        // Fade castle
        this.fadeCastleAway();


        // Show board
        if (this.boardGroup) {
            this.boardGroup.visible = true;
        }


        // Render the latest board safely
        if (this.lastBoard) {
            this.renderBoardState(
                this.lastBoard
            );
        }


        // Normal camera
        this.camera.position.set(
            0,
            10,
            9
        );

        if (this.controls) {

            this.controls.target.set(
                0,
                0,
                0
            );

            this.controls.enabled = true;
            this.controls.update();
        }


        // Hide cinematic UI
        const overlay =
            document.getElementById(
                'chess-cinematic'
            );

        const title =
            document.getElementById(
                'cinematic-title'
            );

        if (title) {
            title.classList.remove('show');
        }

        if (overlay) {
            overlay.classList.add('hide');
            overlay.style.opacity = '0';
        }
    }


    // =====================================================
    // CASTLE FADE
    // =====================================================

    fadeCastleAway() {

        if (!this.cinematicCastle) {
            return;
        }

        const castle =
            this.cinematicCastle;

        this.cinematicCastle = null;

        let opacity = 1;

        const fade = () => {

            opacity -= 0.06;

            castle.traverse(obj => {

                if (!obj.material) {
                    return;
                }

                if (!obj.material.transparent) {
                    obj.material =
                        obj.material.clone();

                    obj.material.transparent = true;
                }

                obj.material.opacity =
                    Math.max(
                        0,
                        opacity
                    );
            });


            if (opacity > 0) {

                requestAnimationFrame(fade);

            } else {

                this.scene.remove(castle);
            }
        };

        fade();
    }


    // =====================================================
    // THREE.JS SCENE
    // =====================================================

    initScene() {

        this.scene =
            new THREE.Scene();

        this.scene.background =
            new THREE.Color(
                0x0b0e14
            );


        // 360 background
        const textureLoader =
            new THREE.TextureLoader();

        textureLoader.load(
            '360.png',
            texture => {

                texture.mapping =
                    THREE.EquirectangularReflectionMapping;

                this.scene.background =
                    texture;
            },
            undefined,
            () => {
                // Keep dark fallback if 360.png is unavailable
            }
        );


        // Camera
        this.camera =
            new THREE.PerspectiveCamera(
                45,
                window.innerWidth /
                window.innerHeight,
                0.1,
                1000
            );

        this.camera.position.set(
            0,
            10,
            9
        );


        // Renderer
        this.renderer =
            new THREE.WebGLRenderer({
                antialias: true,
                alpha: false
            });

        this.renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        this.renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

        this.renderer.shadowMap.enabled = true;

        this.container.innerHTML = '';

        this.container.appendChild(
            this.renderer.domElement
        );


        // Orbit controls
        this.controls =
            new THREE.OrbitControls(
                this.camera,
                this.renderer.domElement
            );

        this.controls.enableDamping = true;
        this.controls.autoRotate = true;
this.controls.autoRotateSpeed = 0.7;
        this.controls.dampingFactor = 0.08;
        this.controls.target.set(0, 0, 0);


        // Lights
        this.scene.add(
            new THREE.AmbientLight(
                0xffffff,
                0.8
            )
        );

        const dir =
            new THREE.DirectionalLight(
                0xffffff,
                0.75
            );

        dir.position.set(
            5,
            12,
            5
        );

        dir.castShadow = true;

this.createAmbientBirds();

        this.scene.add(dir);


        // IMPORTANT:
        // Method now exists, so no createOpeningCastle error.
        this.createOpeningCastle();


        // Resize
        window.addEventListener(
            'resize',
            () => {

                if (!this.camera || !this.renderer) {
                    return;
                }

                this.camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                this.camera.updateProjectionMatrix();

                this.renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );
    }


    // =====================================================
    // BOARD
    // =====================================================

    createBoard() {

        this.boardGroup =
            new THREE.Group();

        this.scene.add(
            this.boardGroup
        );


        const lightMat =
            new THREE.MeshStandardMaterial({
                color: 0xebedf0,
                roughness: 0.3
            });

        const darkMat =
            new THREE.MeshStandardMaterial({
                color: 0x2f3542,
                roughness: 0.3
            });


        const baseMesh =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    9,
                    0.4,
                    9
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x1e272e
                })
            );

        baseMesh.position.y =
            -0.21;

        baseMesh.receiveShadow = true;

        this.boardGroup.add(
            baseMesh
        );


        const squareGeo =
            new THREE.BoxGeometry(
                1,
                0.1,
                1
            );


        for (let r = 0; r < 8; r++) {

            for (let c = 0; c < 8; c++) {

                const mesh =
                    new THREE.Mesh(
                        squareGeo,
                        (r + c) % 2 === 0
                            ? lightMat
                            : darkMat
                    );

                mesh.position.set(
                    c - 3.5,
                    0,
                    r - 3.5
                );

                mesh.userData = {
                    r: r,
                    c: c
                };

                mesh.receiveShadow = true;

                this.boardGroup.add(
                    mesh
                );
            }
        }
    }


    // =====================================================
    // HIGHLIGHTS
    // =====================================================

    showHighlights(moves) {

        this.clearHighlights();

        if (!moves || !Array.isArray(moves)) {
            return;
        }

        const geo =
            new THREE.CylinderGeometry(
                0.35,
                0.35,
                0.05,
                16
            );

        moves.forEach(m => {

            if (!m || !m.to) {
                return;
            }

            const mat =
                new THREE.MeshBasicMaterial({
                    color: 0x4cd137,
                    transparent: true,
                    opacity: 0.8
                });

            const ring =
                new THREE.Mesh(
                    geo,
                    mat
                );

            ring.position.set(
                m.to.c - 3.5,
                0.08,
                m.to.r - 3.5
            );

            this.scene.add(ring);

            this.highlights.push(ring);
        });
    }


    clearHighlights() {

        if (!this.highlights) {
            this.highlights = [];
            return;
        }

        this.highlights.forEach(h => {

            if (h) {
                this.scene.remove(h);

                if (h.geometry) {
                    h.geometry.dispose();
                }

                if (h.material) {
                    h.material.dispose();
                }
            }

        });

        this.highlights = [];
}  
buildPieceMesh(type, isWhite) {
    const group = new THREE.Group();

    // Realistic chess material
    const mainColor = isWhite ? 0xf1f1ee : 0x151515;

    const mat = new THREE.MeshStandardMaterial({
        color: mainColor,
        roughness: isWhite ? 0.22 : 0.28,
        metalness: 0.18
    });

    const darkMat = new THREE.MeshStandardMaterial({
        color: isWhite ? 0xd8d8d2 : 0x080808,
        roughness: 0.25,
        metalness: 0.22
    });

    const goldMat = new THREE.MeshStandardMaterial({
        color: 0xc9a227,
        roughness: 0.18,
        metalness: 0.75
    });

    // -------------------------
    // REALISTIC BASE
    // -------------------------
    const base1 = new THREE.Mesh(
        new THREE.CylinderGeometry(0.43, 0.48, 0.12, 32),
        mat
    );
    base1.position.y = 0.06;
    group.add(base1);

    const base2 = new THREE.Mesh(
        new THREE.CylinderGeometry(0.36, 0.42, 0.10, 32),
        darkMat
    );
    base2.position.y = 0.15;
    group.add(base2);

    // =========================
    // PAWN
    // =========================
    if (type === 'p') {

        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(0.20, 0.29, 0.42, 24),
            mat
        );
        body.position.y = 0.38;
        group.add(body);

        const neck = new THREE.Mesh(

        );
        neck.position.y = 0.67;
        group.add(neck);

        const head = new THREE.Mesh(

        );
        head.position.y = 0.86;
        group.add(head);
    }

    // =========================
    // ROOK
    // =========================
    else if (type === 'r') {

        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(0.27, 0.36, 0.75, 32),
            mat
        );
        body.position.y = 0.52;
        group.add(body);

        const topRing = new THREE.Mesh(
            new THREE.CylinderGeometry(0.34, 0.34, 0.12, 32),
            darkMat
        );
        topRing.position.y = 0.92;
        group.add(topRing);

        // Castle battlements
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;

            const block = new THREE.Mesh(
                new THREE.BoxGeometry(0.13, 0.18, 0.13),
                mat
            );

            block.position.set(
                Math.cos(a) * 0.27,
                1.04,
                Math.sin(a) * 0.27
            );

            group.add(block);
        }
    }

    // =========================
    // KNIGHT
    // =========================
    else if (type === 'n') {

        const body = new THREE.Mesh(
            new THREE.CylinderGeometry(0.25, 0.34, 0.65, 24),
            mat
        );
        body.position.y = 0.48;
        group.add(body);

        const neck = new THREE.Mesh(
            new THREE.CylinderGeometry(0.16, 0.22, 0.55, 20),
            mat
        );
        neck.position.set(0, 0.82, 0.02);
        neck.rotation.x = -0.25;
        group.add(neck);

        const horseHead = new THREE.Mesh(
            new THREE.SphereGeometry(0.25, 24, 20),
            mat
        );
        horseHead.scale.set(0.75, 1.25, 1.15);
        horseHead.position.set(0, 1.12, 0.15);
        group.add(horseHead);

        const muzzle = new THREE.Mesh(
            new THREE.CylinderGeometry(0.10, 0.15, 0.38, 16),

        );
        muzzle.rotation.x = Math.PI / 2;
        muzzle.position.set(0, 1.08, 0.40);
        group.add(muzzle);

        // Horse ears
        [-0.11, 0.11].forEach(x => {
            const ear = new THREE.Mesh(
                new THREE.ConeGeometry(0.07, 0.22, 12),
                mat
            );
            ear.position.set(x, 1.40, 0.04);
            ear.rotation.z = x < 0 ? -0.18 : 0.18;
            group.add(ear);
        });
    }

    // =========================
    // BISHOP / BAAZIR
    // =========================
    else if (type === 'b') {

        const lower = new THREE.Mesh(
            new THREE.CylinderGeometry(0.24, 0.34, 0.42, 32),
            mat
        );
        lower.position.y = 0.40;
        group.add(lower);

            new THREE.CylinderGeometry(0.14, 0.23, 0.48, 24),

        );

            new THREE.ConeGeometry(0.08, 0.22, 16),

        );
        tip.position.y = 1.43;
        group.add(tip);
    }

    // =========================
    // QUEEN / RANI
    // =========================
    else if (type === 'q') {

        // Wide elegant queen body
        const lowerBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.30, 0.40, 0.35, 32),
            mat
        );
        lowerBody.position.y = 0.34;
        group.add(lowerBody);

        const waist = new THREE.Mesh(
            new THREE.CylinderGeometry(0.18, 0.29, 0.55, 32),

        );
        waist.position.y = 0.78;
        group.add(waist);

        const upperRing = new THREE.Mesh(
            new THREE.CylinderGeometry(0.26, 0.18, 0.12, 32),
            mat
        );
        upperRing.position.y = 1.08;
        group.add(upperRing);

        // Queen crown
        const crownBase = new THREE.Mesh(

            goldMat
        );
        crownBase.position.y = 1.18;
        group.add(crownBase);

        // 8 crown spikes
        for (let i = 0; i < 8; i++) {

            const a = (i / 8) * Math.PI * 2;

            const spike = new THREE.Mesh(
                new THREE.ConeGeometry(0.075, 0.34, 12),
                goldMat
            );

            spike.position.set(
                Math.cos(a) * 0.21,
                1.39,
                Math.sin(a) * 0.21
            );

            group.add(spike);
        }

        // Queen center jewel
        const jewel = new THREE.Mesh(
            new THREE.SphereGeometry(0.085, 20, 20),
            goldMat
        );
        jewel.position.y = 1.57;
        group.add(jewel);
    }

    // =========================
    // KING / RAJA
    // =========================
    else if (type === 'k') {

        // Heavy king base
        const lowerBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.34, 0.43, 0.38, 32),
            mat
        );
        lowerBody.position.y = 0.36;
        group.add(lowerBody);

        const mainBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.25, 0.34, 0.62, 32),
            mat
        );
        mainBody.position.y = 0.82;
        group.add(mainBody);

        // King collar
        const collar = new THREE.Mesh(
            new THREE.CylinderGeometry(0.31, 0.28, 0.13, 32),
            goldMat
        );
        collar.position.y = 1.15;
        group.add(collar);

        // King crown
        const crown = new THREE.Mesh(
            new THREE.CylinderGeometry(0.24, 0.29, 0.20, 8),
            goldMat
        );
        crown.position.y = 1.30;
        group.add(crown);

        // Cross — clearly identifies the King
        const crossV = new THREE.Mesh(
            new THREE.BoxGeometry(0.075, 0.34, 0.075),
            goldMat
        );
        crossV.position.y = 1.59;
        group.add(crossV);

        const crossH = new THREE.Mesh(
            new THREE.BoxGeometry(0.25, 0.075, 0.075),
            goldMat
        );
        crossH.position.y = 1.65;
        group.add(crossH);
    }

    // Better shadows
    group.traverse(obj => {
        if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
        }
    });

    return group;
}

    // =====================================================
    // RENDER BOARD STATE
    // =====================================================

    renderBoardState(board) {

        if (!this.scene) return;
        if (!this.pieces3D) return;
        if (!Array.isArray(board)) return;

        this.lastBoard = board;


        // Remove old pieces
        for (let r = 0; r < 8; r++) {

            for (let c = 0; c < 8; c++) {

                const oldPiece =
                    this.pieces3D[r][c];

                if (oldPiece) {

                    this.scene.remove(
                        oldPiece
                    );

                    oldPiece.traverse(obj => {

                        if (obj.geometry) {
                            obj.geometry.dispose();
                        }

                        if (obj.material) {

                            if (Array.isArray(obj.material)) {
                                obj.material.forEach(m => {
                                    if (m && m.dispose) {
                                        m.dispose();
                                    }
                                });

animateMove(move, onComplete) {

    this.clearHighlights();

    if (!move || !move.from || !move.to) {
        if (onComplete) onComplete();
        return;
    }

    const fromRow = move.from.r;
    const fromCol = move.from.c;
    const toRow = move.to.r;
    const toCol = move.to.c;

    const mover = this.pieces3D[fromRow][fromCol];

    if (!mover) {
        if (onComplete) onComplete();
        return;
    }

    // Normal capture / en-passant capture
    const captureRow = move.enPassant ? fromRow : toRow;
    const captureCol = move.to.c;

    const victim = this.pieces3D[captureRow][captureCol];

    const isCapture = !!victim && victim !== mover;

    // Destination
    const startX = mover.position.x;
    const startZ = mover.position.z;
    const targetX = toCol - 3.5;
    const targetZ = toRow - 3.5;

    // Random knockback direction
    const angle = Math.random() * Math.PI * 2;
    const knockDistance = 0.65 + Math.random() * 0.55;

    const victimStart = isCapture
        ? victim.position.clone()
        : null;

    const victimEnd = isCapture
        ? victimStart.clone().add(new THREE.Vector3(
            Math.cos(angle) * knockDistance,
            0.8 + Math.random() * 0.55,
            Math.sin(angle) * knockDistance
        ))
        : null;

    // Clone victim materials so other pieces are unaffected
    if (isCapture) {
        victim.traverse(obj => {
            if (!obj.material) return;

            if (Array.isArray(obj.material)) {
                obj.material = obj.material.map(m => {
                    const copy = m.clone();
                    copy.transparent = true;
                    return copy;
                });
            } else {
                obj.material = obj.material.clone();
                obj.material.transparent = true;
            }
        });
    }

    const startTime = performance.now();
    const duration = isCapture ? 620 : 480;

    const step = now => {

        const progress = Math.min(
            1,
            (now - startTime) / duration
        );

        const smooth = progress < 0.5
            ? 4 * progress * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        // Moving piece travels to destination
        mover.position.x =
            startX + (targetX - startX) * smooth;

        mover.position.z =
            startZ + (targetZ - startZ) * smooth;

        mover.position.y =
            0.05 + Math.sin(progress * Math.PI) * 0.65;

        // Captured piece gets knocked away during the move
        if (isCapture) {

            victim.position.lerpVectors(
                victimStart,
                victimEnd,
                smooth
            );

            victim.rotation.x += 0.045;
            victim.rotation.z += 0.055;

            victim.position.y +=
                Math.sin(progress * Math.PI) * 0.025;

            const opacity = Math.max(
                0,
                1 - Math.pow(progress, 1.5)
            );

            victim.traverse(obj => {
                if (!obj.material) return;

                const materials = Array.isArray(obj.material)
                    ? obj.material
                    : [obj.material];

                materials.forEach(mat => {
                    mat.opacity = opacity;
                });
            });
        }

        if (progress < 1) {
            requestAnimationFrame(step);
        } else {

            mover.position.set(targetX, 0.05, targetZ);

            if (isCapture) {
                victim.visible = false;
            }

            if (onComplete) onComplete();
        }
    };

    requestAnimationFrame(step);
}

            if (!data.secondsByGame) data.secondsByGame = {};
            if (!data.matchesByGame) data.matchesByGame = {};
            if (!data.winsByGame) data.winsByGame = {};
            return data;
        } catch (e) {
            return {
                secondsByGame: {},
                matchesByGame: {},
                winsByGame: {}
            };
        }
    }

    function flush() {
        if (!playing || document.hidden || !lastTick) return;

        const now = Date.now();
        const seconds = Math.min(5, Math.max(0, Math.floor((now - lastTick) / 1000)));
        lastTick = now;

        if (!seconds) return;

        const data = readData();
        data.secondsByGame[GAME_ID] =
            (Number(data.secondsByGame[GAME_ID]) || 0) + seconds;

        localStorage.setItem(storageKey, JSON.stringify(data));
    }

    window.NDRewardTracker = {
        startMatch() {
            playing = true;
            lastTick = Date.now();

            if (timer) clearInterval(timer);
            timer = setInterval(flush, 1000);
        },

        endMatch(won) {
            flush();
            playing = false;
            lastTick = 0;

            if (timer) {
                clearInterval(timer);
                timer = null;
            }

            const data = readData();
            data.matchesByGame[GAME_ID] =
                (Number(data.matchesByGame[GAME_ID]) || 0) + 1;

            if (won) {
                data.winsByGame[GAME_ID] =
                    (Number(data.winsByGame[GAME_ID]) || 0) + 1;
            }

            localStorage.setItem(storageKey, JSON.stringify(data));
        },

        addDistance(meters) {
            const data = readData();
            if (!data.metersByGame) data.metersByGame = {};
            data.metersByGame[GAME_ID] =
                (Number(data.metersByGame[GAME_ID]) || 0) +
                Math.max(0, Number(meters) || 0);
            localStorage.setItem(storageKey, JSON.stringify(data));
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            flush();
        } else if (playing) {
            lastTick = Date.now();
        }
    });

    window.addEventListener("beforeunload", flush);
})();
</script>
</body>
</html>
