<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>DUO BATTLE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
overflow:hidden;

font-family:Arial,sans-serif;

background:
linear-gradient(180deg,
#04040a,
#11051d,
#050510);

color:#fff;

}

/* SKY */

#sky{
position:fixed;
inset:0;
background:
linear-gradient(rgba(10,5,25,.35),rgba(10,5,25,.55)),
url("arena_bg.webp") center center/cover no-repeat;
overflow:hidden;
}


/* STARS */

#stars{

position:absolute;

width:100%;
height:100%;

}

/* THUNDER */

.flash{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

background:white;

opacity:0;

animation:

flash 8s infinite;

}

@keyframes flash{

0%,96%,100%{

opacity:0;

}

97%{

opacity:.35;

}

98%{

opacity:0;

}

99%{

opacity:.15;

}

}

/* LOADER */

#loader{

position:fixed;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

display:flex;

flex-direction:column;

align-items:center;

gap:18px;

z-index:100;

}

.loader{

width:120px;

height:120px;

border-radius:50%;

border:7px solid
rgba(255,255,255,.15);

border-top:

7px solid
#8b5cff;

border-right:

7px solid
#00d4ff;

animation:

spin 1s linear infinite;

box-shadow:

0 0 30px #6f49ff;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

#loadingText{

font-size:26px;

font-weight:bold;

letter-spacing:3px;

text-shadow:

0 0 20px #7b5cff;

animation:

pulse 1.2s infinite;

}

@keyframes pulse{

50%{

opacity:.4;

}

}
/* ===== MENU ===== */

#menu{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

display:none;

overflow-y:auto;

padding:20px;

z-index:50;

}

#title{

text-align:center;

font-size:42px;

font-weight:bold;

letter-spacing:3px;

margin-top:20px;

text-shadow:

0 0 15px #8b5cff,

0 0 35px #00d4ff;

}

#subtitle{

text-align:center;

margin-top:8px;

margin-bottom:30px;

opacity:.8;

font-size:18px;

}

.games{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:18px;

padding-bottom:80px;

}

.card{

background:

rgba(255,255,255,.08);

border:

1px solid rgba(255,255,255,.18);

border-radius:22px;

overflow:hidden;

backdrop-filter:blur(12px);

box-shadow:

0 0 25px rgba(0,0,0,.5);

transition:.25s;

}

.card:active{

transform:scale(.96);

}

.card img{

width:100%;

height:170px;

object-fit:cover;

display:block;

}

.name{

font-size:22px;

font-weight:bold;

text-align:center;

padding:14px 0;

}

.play{

width:85%;

height:50px;

margin:0 auto 18px;

display:block;

border:none;

border-radius:14px;

font-size:18px;

font-weight:bold;

color:#fff;

background:

linear-gradient(90deg,

#4f5dff,

#933bff);

box-shadow:

0 0 18px #6f49ff;

}

#backBtn{

position:fixed;

left:15px;

top:15px;

width:110px;

height:46px;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

background:#ffffff22;

color:#fff;

backdrop-filter:blur(8px);

}
/* ===== REAL STORM ===== */

#storm{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

pointer-events:none;

overflow:hidden;

z-index:2;

}

.cloud{

position:absolute;

width:900px;
height:320px;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.12),

rgba(110,70,170,.10),

transparent 72%);

filter:blur(45px);

animation:cloudMove linear infinite;

}

.cloud:nth-child(1){

top:-60px;

left:-250px;

animation-duration:32s;

}

.cloud:nth-child(2){

top:80px;

right:-280px;

animation-duration:38s;

}

.cloud:nth-child(3){

bottom:30px;

left:-180px;

animation-duration:44s;

}

@keyframes cloudMove{

0%{

transform:translateX(0);

}

50%{

transform:translateX(140px);

}

100%{

transform:translateX(0);

}

}



</style>

</head>

<body>

<div id="sky">

<div id="stars"></div>

<div class="flash"></div>

</div>

<div id="loader">

<div class="loader"></div>

<div id="loadingText">

Loading...

</div>

</div>
<div id="menu">

<h1 id="title">DUO BATTLE</h1>

<p id="subtitle">
Choose Your Battle
</p>

<button id="backBtn"
onclick="history.back()">
🔙BACK
</button>

<div class="games">

<div class="card">

<img src="mybomb.png">

<div class="name">
Boom Duo
</div>

<button class="play"
onclick="location.href='boomvsgame.html'">

PLAY ▶️ 

</button>

</div>

<div class="card">

<img src="myghost.png">

<div class="name">
Ghost Chase
</div>

<button class="play"
onclick="location.href='ghostchase_FIXED_v2 (1).html'">
 
 PLAY ▶️ 

</button>

</div>

<div class="card">

<img src="mychess.png">

<div class="name">
3D Chess
</div>

<button class="play"
onclick="location.href='Chessduel.html'">

PLAY ▶️ 

</button>

</div>

<div class="card">

<img src="mybow.png">

<div class="name">
Bowmasters
</div>

<button class="play"
onclick="alert('Coming Soon')">

COMING SOON

</button>

</div>
<div class="game-card">

    <div class="game-icon">
        <img
            src="https://cdn3d.iconscout.com/3d/premium/thumb/gamepad-3d-icon-png-download-12203311.png"
            alt="3D Games Hub"
            style="
                width:100%;
                max-width:150px;
                height:100px;
                object-fit:contain;
                border-radius:18px;
            ">
    </div>

    <h2>3D Games Hub</h2>
<p>Snake &bull; Carrom &bull; Zero-Kata &bull; Color Clash</p>

    <button
        class="secondary play-btn"
        onclick="window.location.href='3D_Games_Hub_FIXED.html'">
        PLAY
</button>

</div>
</div>

</div>
<script>

/* ===== CREATE STARS ===== */

const stars=document.getElementById("stars");

for(let i=0;i<140;i++){

const s=document.createElement("div");

s.style.position="absolute";

s.style.width=(1+Math.random()*3)+"px";

s.style.height=s.style.width;

s.style.borderRadius="50%";

s.style.background="#fff";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";

s.style.opacity=Math.random();

s.animate([

{opacity:.2},

{opacity:1},

{opacity:.2}

],{

duration:1000+Math.random()*4000,

iterations:Infinity

});

stars.appendChild(s);

}

/* ===== SHOW MENU ===== */

setTimeout(()=>{

loader.style.opacity="0";

setTimeout(()=>{

loader.style.display="none";

menu.style.display="block";

menu.animate([

{

opacity:0,

transform:"translateY(40px)"

},

{

opacity:1,

transform:"translateY(0)"

}

],{

duration:700,

fill:"forwards"

});

},500);

},2500);

/* ===== CARD EFFECT ===== */

document.querySelectorAll(".card").forEach(card=>{

card.onmousemove=()=>{

card.style.transform="scale(1.03)";

card.style.boxShadow="0 0 35px #7a52ff";

};

card.onmouseleave=()=>{

card.style.transform="scale(1)";

card.style.boxShadow="0 0 25px rgba(0,0,0,.5)";

};

});
/* ===== FOG ===== */

setInterval(()=>{

const fog=document.createElement("div");

fog.style.position="fixed";
fog.style.left="-20%";
fog.style.bottom=(Math.random()*40)+"px";

fog.style.width="220px";
fog.style.height="90px";

fog.style.background=
"radial-gradient(circle,rgba(255,255,255,.10),transparent 70%)";

fog.style.filter="blur(25px)";

fog.style.zIndex="5";

fog.style.pointerEvents="none";

document.body.appendChild(fog);

fog.animate([

{

transform:"translateX(0)",

opacity:.15

},

{

transform:"translateX(140vw)",

opacity:.05

}

],{

duration:18000,

fill:"forwards"

}).onfinish=()=>fog.remove();

},1200);

/* ===== RANDOM THUNDER ===== */

setInterval(()=>{

document.querySelector(".flash").animate([

{opacity:0},

{opacity:.35},

{opacity:0},

{opacity:.18},

{opacity:0}

],{

duration:300

});

},6000);

/* ===== END ===== */
/* ===== REAL STORM FX ===== */



/* Random lightning */

setInterval(()=>{

const flash=document.createElement("div");

flash.style.position="fixed";
flash.style.left=Math.random()*100+"%";
flash.style.top="0";

flash.style.width="4px";
flash.style.height="65%";

flash.style.background=
"linear-gradient(white,#9fdcff,transparent)";

flash.style.boxShadow=
"0 0 35px white";

flash.style.transform=
`rotate(${Math.random()*30-15}deg)`;

flash.style.zIndex="20";

document.body.appendChild(flash);

document.body.animate([

{filter:"brightness(1)"},

{filter:"brightness(1.45)"},

{filter:"brightness(1)"}

],{

duration:180

});

setTimeout(()=>flash.remove(),180);

},2500+Math.random()*3000);

/* Flying dust */

setInterval(()=>{

const d=document.createElement("div");

d.style.position="fixed";

d.style.left=Math.random()*100+"vw";

d.style.bottom="0";

d.style.width="3px";

d.style.height="3px";

d.style.borderRadius="50%";

d.style.background="#d9c8ff";

d.style.boxShadow="0 0 10px #fff";

d.style.zIndex="6";

document.body.appendChild(d);

d.animate([

{transform:"translate(0,0)",opacity:0},

{opacity:1},

{transform:"translate(-150px,-100vh)",opacity:0}

],{

duration:3500,

fill:"forwards"

}).onfinish=()=>d.remove();

},120);

</script>
<!-- ===== STORM LAYER ===== -->

<div id="storm">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>


</div>
<div class="lightGlow"></div>

<script>


/* ===== DEBRIS + PURPLE GLOW ===== */



/* Flying debris */

setInterval(()=>{

const p=document.createElement("div");

p.style.position="absolute";

p.style.left=(45+Math.random()*10)+"%";

p.style.bottom="20px";

p.style.width=(2+Math.random()*4)+"px";

p.style.height=p.style.width;

p.style.borderRadius="50%";

p.style.background=
Math.random()>.5?"#ffffff":"#9d7cff";

p.style.boxShadow=
"0 0 8px rgba(180,120,255,.8)";

storm.appendChild(p);

const x=(Math.random()*240)-120;
const y=-420-Math.random()*220;

p.animate([

{
transform:"translate(0,0) scale(1)",
opacity:.2
},

{
transform:`translate(${x}px,${y}px) rotate(720deg) scale(.2)`,
opacity:1
},

{
transform:`translate(${x*1.4}px,${y-120}px) rotate(1200deg) scale(0)`,
opacity:0
}

],{

duration:2200+Math.random()*1000,

fill:"forwards"

}).onfinish=()=>p.remove();

},90);

/* Purple storm pulse */

setInterval(()=>{

document.body.animate([

{filter:"brightness(1)"},

{filter:"brightness(1.08) saturate(1.2)"},

{filter:"brightness(1)"}

],{

duration:600

});

},5000);

/* ===== FLYING ROCKS ===== */

const storm=document.getElementById("storm");

setInterval(()=>{

const rock=document.createElement("div");

rock.style.position="absolute";

rock.style.left=(35+Math.random()*30)+"%";

rock.style.bottom=(20+Math.random()*80)+"px";

let size=10+Math.random()*14;

rock.style.width=size+"px";
rock.style.height=size+"px";

rock.style.borderRadius="35%";

rock.style.background=
"linear-gradient(135deg,#888,#444,#222)";

rock.style.boxShadow=
"0 0 18px rgba(255,255,255,.5)";
storm.appendChild(rock);

const angle=Math.random()*Math.PI*2;
const radius=80+Math.random()*120;

rock.animate([

{
transform:"translate(0,0) rotate(0deg)",
opacity:0
},

{
transform:`translate(${Math.cos(angle)*radius}px,-${180+Math.random()*220}px) rotate(540deg)`,
opacity:1
},

{
transform:`translate(${Math.cos(angle)*(radius+80)}px,-${420+Math.random()*180}px) rotate(1080deg)`,
opacity:0
}

],{

duration:1800+Math.random()*1200,
fill:"forwards"

}).onfinish=()=>rock.remove();

},180);
/* ===== WIND STREAKS ===== */

setInterval(()=>{

const wind=document.createElement("div");

wind.style.position="fixed";
wind.style.left="-180px";
wind.style.top=(Math.random()*window.innerHeight)+"px";

wind.style.width=(80+Math.random()*120)+"px";
wind.style.height="2px";

wind.style.background=
"linear-gradient(90deg,
transparent,
rgba(220,220,255,.9),
transparent)";

wind.style.filter="blur(1px)";
wind.style.opacity=".7";
wind.style.pointerEvents="none";
wind.style.zIndex="7";

document.body.appendChild(wind);

wind.animate([

{
transform:"translateX(0) skewX(-25deg)",
opacity:0
},

{
opacity:1
},

{
transform:`translateX(${window.innerWidth+300}px) skewX(-25deg)`,
opacity:0
}

],{

duration:700+Math.random()*500,
fill:"forwards"

}).onfinish=()=>wind.remove();

},180);
/* ===== DUST VORTEX ===== */

setInterval(()=>{

const dust=document.createElement("div");

dust.style.position="fixed";
dust.style.left=(46+Math.random()*8)+"%";
dust.style.bottom="0";

let s=8+Math.random()*16;

dust.style.width=s+"px";
dust.style.height=s+"px";

dust.style.borderRadius="50%";

dust.style.background=
"rgba(170,170,170,.45)";

dust.style.filter="blur(2px)";

dust.style.pointerEvents="none";

dust.style.zIndex="8";

document.body.appendChild(dust);

const dir=Math.random()>0.5?1:-1;

dust.animate([

{
transform:"translate(0,0) scale(.3)",
opacity:0
},

{
transform:`translate(${dir*70}px,-180px) rotate(360deg) scale(1)`,
opacity:.8
},

{
transform:`translate(${dir*140}px,-520px) rotate(1080deg) scale(.2)`,
opacity:0
}

],{

duration:2200+Math.random()*1200,

fill:"forwards"

}).onfinish=()=>dust.remove();

},100);
</script>
</body>

</html>
