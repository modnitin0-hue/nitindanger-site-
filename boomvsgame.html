<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bomb Squad Pro HD - Ultimate Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width:100%;
            height:100%;
            overflow:hidden;
            margin:0;
            padding:0;
            background:#05070a;
            font-family:'Segoe UI',sans-serif;
        }

        
/* ===== GAME CONTAINER FIX ===== */
#game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,180,0,.15), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(0,170,255,.12), transparent 35%),
        radial-gradient(circle at 50% 85%, rgba(0,255,150,.08), transparent 40%),
        linear-gradient(180deg,#08111d 0%,#111c2b 40%,#060b14 100%);
    overflow: hidden;
    isolation: isolate;
}


        #game-container::before {
            content:"";
            position:absolute;
            inset:0;
            background:
            repeating-linear-gradient(
                45deg,
                rgba(255,255,255,.015) 0px,
                rgba(255,255,255,.015) 2px,
                transparent 2px,
                transparent 40px
            );
            pointer-events:none;
        }

        #game-container::after {
            content:"";
            position:absolute;
            width:700px;
            height:700px;
            border-radius:50%;
            background:radial-gradient(circle,
                rgba(255,200,0,.18),
                transparent 70%);
            filter:blur(20px);
            animation:bgMove 8s ease-in-out infinite alternate;
            pointer-events:none;
        }

        @keyframes bgMove {
            from { transform:translate(-150px,-120px); }
            to { transform:translate(180px,120px); }
        }

        .menu-screen {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    isolation: isolate;
    background:
        radial-gradient(ellipse at 50% 45%, rgba(255, 117, 24, .19), transparent 46%),
        radial-gradient(ellipse at 15% 80%, rgba(0, 195, 255, .17), transparent 42%),
        linear-gradient(145deg, #050912, #152333 52%, #080b13);
}



.menu-card {
    position: relative;
    z-index: 2;
    width: min(86%, 480px);
    max-height: 94%;
    overflow-y: auto;
    padding: clamp(18px, 4.5vw, 32px);
    border-radius: 25px;
    background: linear-gradient(
        145deg,
        rgba(23, 37, 57, .96),
        rgba(7, 13, 24, .96)
    );
    border: 2px solid rgba(255, 184, 54, .82);
    box-shadow:
        0 0 18px rgba(255, 144, 24, .3),
        0 0 55px rgba(0, 177, 255, .16),
        inset 0 0 28px rgba(255, 255, 255, .045);
    animation: cardFloat 3s ease-in-out infinite;
}

@keyframes cardFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

        h1 {
            font-size: clamp(29px, 7vw, 48px);
letter-spacing: clamp(1px, 1vw, 4px);
color: #ffd66b;
text-shadow:
    0 2px 0 #70400b,
    0 4px 0 #432b14,
    0 0 14px rgba(255, 174, 45, .9),
    0 0 28px rgba(255, 95, 20, .45);
            animation:titleFloat 2.5s ease-in-out infinite;
            text-align: center;
        }

        @keyframes titleFloat {
            0% { transform:translateY(0) scale(1); }
            50% { transform:translateY(-4px) scale(1.02); }
            100% { transform:translateY(0) scale(1); }
        }

        .setting-group {
            margin: 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
    font-size: clamp(.82rem, 3.5vw, 1.05rem);
    color: #eaf5ff;
    font-weight: 800;
}

        select, button.toggle-btn {
            padding: 10px 16px;
            font-size: 1rem;
            border-radius: 12px;
            border: 2px solid #f39c12;
            background: #f1f6fc;
color: #142033;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-play {
            background: linear-gradient(180deg, #2ed573 0%, #20bf6b 100%);
            color: white;
            font-size: 1.6rem;
            font-weight: 800;
            padding: 14px 40px;
            margin-top: 20px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            box-shadow: 0 6px 0px #158a47, 0 10px 20px rgba(46, 213, 115, 0.4);
            transition: all 0.1s ease;
            width: 100%;
        }

        #menuEmoji {
            font-size:70px;
            text-align:center;
            margin-bottom:12px;
            animation:emojiBounce 2s infinite;
            filter:drop-shadow(0 0 12px rgba(255,215,0,.7));
        }

        @keyframes emojiBounce {
            0% { transform:scale(.8) rotate(-8deg); opacity:0; }
            20% { transform:scale(1.15) rotate(5deg); opacity:1; }
            50% { transform:scale(1); }
            80% { transform:scale(1.1) rotate(-5deg); }
            100% { transform:scale(.8) rotate(8deg); opacity:0; }
        }

        .btn-play:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #158a47;
        }

        /* Overlay Screens */
        #overlay-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            z-index: 25;
        }

        #countdown-text {
            font-size: 8rem;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 40px #e67e22, 5px 5px 0px #000;
        }

        #winner-text {
            font-size: 3rem;
            color: #2ed573;
            margin-bottom: 10px;
            text-shadow: 0 0 25px #2ed573;
            text-align: center;
            font-weight: 800;
        }

/* ===== WINNER ZOOM + DANCE CUTSCENE ===== */
#victory-cutscene {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
    background:
        radial-gradient(circle, rgba(255,190,40,.25), transparent 55%),
        rgba(3,7,15,.96);
}

.victory-camera {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: victoryCameraZoom 2.6s ease-in-out forwards;
}

.victory-character {
    width: min(58vw, 260px);
    height: min(38vh, 260px);
    object-fit: contain;
    filter: drop-shadow(0 0 24px rgba(255,205,50,.85));
    transform-origin: 50% 85%;
    animation: winnerDance .42s ease-in-out infinite alternate;
}

.victory-fallback {
    display: none;
    font-size: 100px;
    animation: winnerDance .42s ease-in-out infinite alternate;
}

.victory-label {
    color: #ffd85c;
    font-size: clamp(24px, 6vw, 42px);
    font-weight: 900;
    text-align: center;
    text-shadow: 0 0 22px #ff8c00;
}

@keyframes victoryCameraZoom {
    0%   { transform: scale(.25) translateY(45px); opacity: 0; }
    35%  { transform: scale(1.05) translateY(0); opacity: 1; }
    65%  { transform: scale(1) rotate(-2deg); opacity: 1; }
    100% { transform: scale(1.12) rotate(2deg); opacity: 1; }
}

@keyframes winnerDance {
    from { transform: rotate(-9deg) translateY(0) scale(1); }
    to   { transform: rotate(9deg) translateY(-12px) scale(1.06); }
}

        /* Winner Effects Styling */
        #winnerEffects {
            display: flex;
            gap: 20px;
            font-size: 4rem;
            margin-bottom: 20px;
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Responsive Mobile Controls */
        .touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 15;
        }

        .joystick-base {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.12);
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        #joy-base-p1 { bottom: 30px; left: 30px; }
        #btn-bomb-p1 { bottom: 35px; right: 40px; }
        #joy-base-p2 { top: 30px; right: 150px; }
        #btn-bomb-p2 { top: 35px; right: 30px; }

        .joystick-stick {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 54px;
            height: 54px;
            background: radial-gradient(circle, #70a1ff, #1e90ff);
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-bomb-round {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #ff6b6b, #ff4757);
            border: 4px solid #ffffff;
            border-radius: 50%;
            color: white;
            font-size: 1.1rem;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }

        .btn-bomb-round:active {
            transform: scale(0.90);
        }
#overlay-screen.showVictory::after{
    content:"";
    position:absolute;
    inset:-50%;
    background:linear-gradient(
        120deg,
        transparent 20%,
        rgba(255,215,0,.25),
rgba(255,193,7,1),
rgba(255,215,0,.25),
        transparent 90%
    );
    animation: shineSweep 2.5s linear infinite;
}

@keyframes shineSweep{
    from{
        transform:translateX(-120%);
    }
    to{
        transform:translateX(120%);
    }
}
.menu-tagline {
    margin-top: 8px;
    color: #70e8ff;
    text-align: center;
    font-size: clamp(10px, 2.8vw, 13px);
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(65, 213, 255, .55);
}

.menu-caption {
    margin: 7px 0 20px;
    color: #c7d3e3;
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
}


/* ===== BOMB SQUAD SHARP JUNGLE MENU ===== */

#main-menu {
    position: absolute;
    inset: 0;
    isolation: isolate;
    overflow: hidden;
    background-color: #07130c;
    background-image:
        linear-gradient(
            90deg,
            rgba(3, 12, 8, .48),
            rgba(4, 17, 12, .12) 48%,
            rgba(2, 10, 8, .48)
        ),
        linear-gradient(
            0deg,
            rgba(2, 9, 6, .48),
            transparent 65%,
            rgba(2, 8, 5, .16)
        ),
        var(--jungle-bg, none);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

/* Jungle lighting only � no blur */
#main-menu::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at 15% 25%,
            rgba(143, 255, 159, .13),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 85% 70%,
            rgba(75, 220, 144, .10),
            transparent 40%
        );
    animation: jungleLightMove 9s ease-in-out infinite alternate;
}

/* Remove old mist / blur layer */
#main-menu::after {
    content: none;
    display: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}

/* Menu content stays above background decorations */
#main-menu > * {
    z-index: 2;
}

/* Decorative bombs in all four corners */
#main-menu .menu-bomb-decoration {
    position: absolute;
    z-index: 1;
    pointer-events: none;
    user-select: none;
    opacity: .82;
    filter: drop-shadow(0 5px 9px rgba(0, 0, 0, .65));
    animation: jungleBombFloat 4s ease-in-out infinite;
}

#main-menu .menu-bomb-top-left {
    top: 4%;
    left: 3%;
    font-size: clamp(27px, 5vw, 48px);
    transform: rotate(-16deg);
}

#main-menu .menu-bomb-top-right {
    top: 5%;
    right: 3%;
    font-size: clamp(25px, 4.5vw, 43px);
    animation-delay: -.8s;
}

#main-menu .menu-bomb-bottom-left {
    bottom: 4%;
    left: 3%;
    font-size: clamp(25px, 4.5vw, 43px);
    animation-delay: -1.5s;
}

#main-menu .menu-bomb-bottom-right {
    bottom: 4%;
    right: 3%;
    font-size: clamp(27px, 5vw, 48px);
    animation-delay: -2s;
}

/* Premium glass panel */
#main-menu .menu-card {
    position: relative;
    z-index: 3;
    width: min(90%, 460px);
    max-height: 92%;
    overflow-y: auto;
    padding: clamp(18px, 4vw, 30px);
    border: 1px solid rgba(178, 255, 192, .48);
    border-radius: 22px;
    background: linear-gradient(
        145deg,
        rgba(8, 24, 17, .91),
        rgba(3, 10, 9, .95)
    );
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    box-shadow:
        0 20px 55px rgba(0, 0, 0, .58),
        inset 0 1px rgba(255, 255, 255, .10),
        0 0 30px rgba(73, 255, 132, .12);
    animation: junglePanelFloat 4s ease-in-out infinite;
}

#main-menu h1 {
    color: #f2ffe8;
    font-size: clamp(30px, 7vw, 48px);
    letter-spacing: clamp(1px, .8vw, 4px);
    line-height: 1.12;
    text-shadow:
        0 2px 0 #24452d,
        0 0 12px rgba(106, 255, 139, .45),
        0 5px 18px #000;
}

#main-menu label {
    color: #e5f5e8;
    font-weight: 800;
}

#main-menu select,
#main-menu button.toggle-btn {
    color: #14251a;
    background: #edf7ed;
    border-color: #80c991;
}

#main-menu .btn-play {
    border: 1px solid rgba(224, 255, 227, .5);
    background: linear-gradient(180deg, #51d879, #168745);
    box-shadow:
        0 5px 0 #0b4b27,
        0 9px 24px rgba(36, 230, 105, .20);
}

#menuEmoji {
    position: relative;
    z-index: 3;
    filter: drop-shadow(0 0 12px rgba(150, 255, 174, .55));
}

@keyframes jungleLightMove {
    0% {
        transform: translate(-1%, -1%);
        opacity: .65;
    }
    50% {
        opacity: 1;
    }
    100% {
        transform: translate(1%, 1%);
        opacity: .75;
    }
}

@keyframes jungleBombFloat {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -7px; }
}

@keyframes junglePanelFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}

@media (prefers-reduced-motion: reduce) {
    #main-menu::before,
    #main-menu .menu-card,
    #main-menu .menu-bomb-decoration {
        animation: none !important;
    }
}

/* ===== REALISTIC JUNGLE VICTORY SCREEN ===== */
#victory-cutscene {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 18px;
    background:
        linear-gradient(rgba(2, 12, 7, .65), rgba(1, 8, 5, .94)),
        url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=85")
        center / cover no-repeat;
}

.victory-stage {
    width: min(94%, 520px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 24px 16px;
    border: 1px solid rgba(177, 255, 190, .45);
    border-radius: 24px;
    background: rgba(4, 19, 12, .74);
    box-shadow: 0 0 50px rgba(0, 0, 0, .65);
    animation: victoryStageEnter 2.8s cubic-bezier(.18,.78,.2,1) both;
}

@keyframes victoryStageEnter {
    0%   { transform: scale(.35) translateY(35px); opacity: 0; }
    45%  { transform: scale(1.04); opacity: 1; }
    70%  { transform: scale(1); }
    100% { transform: scale(1.02); opacity: 1; }
}

.victory-kicker {
    color: #b6ffc1;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 4px;
    text-align: center;
}

.victory-character-wrap {
    position: relative;
    width: min(66vw, 290px);
    height: min(38vh, 300px);
    display: grid;
    place-items: center;
    isolation: isolate;
}

.victory-character {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter:
        drop-shadow(0 0 12px rgba(130, 255, 157, .6))
        drop-shadow(0 14px 18px rgba(0, 0, 0, .65));
    transform-origin: 50% 85%;
    animation: championDance .48s ease-in-out infinite alternate;
}

.victory-fallback {
    display: none;
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    place-items: center;
    font-size: clamp(65px, 18vw, 110px);
}

.victory-ring {
    position: absolute;
    z-index: 1;
    width: 82%;
    aspect-ratio: 1;
    border: 2px solid rgba(144, 255, 164, .48);
    border-radius: 50%;
    box-shadow:
        0 0 20px rgba(79, 255, 125, .2),
        inset 0 0 22px rgba(79, 255, 125, .14);
    animation: trophyRing 5s linear infinite;
}

.victory-trophy {
    position: absolute;
    z-index: 3;
    right: -3%;
    bottom: 2%;
    font-size: clamp(36px, 10vw, 60px);
    filter: drop-shadow(0 0 12px rgba(255, 205, 54, .75));
    animation: trophyBounce .7s ease-in-out infinite alternate;
}

@keyframes trophyRing {
    from { transform: rotate(0deg) scale(.96); }
    to   { transform: rotate(360deg) scale(1.04); }
}

@keyframes trophyBounce {
    from { transform: translateY(0) rotate(-8deg); }
    to   { transform: translateY(-7px) rotate(8deg); }
}

@keyframes championDance {
    from { transform: rotate(-4deg) translateY(0) scale(1); }
    to   { transform: rotate(4deg) translateY(-8px) scale(1.035); }
}

.victory-label {
    color: #f0ffe9;
    font-size: clamp(22px, 5.5vw, 38px);
    font-weight: 1000;
    line-height: 1.15;
    text-align: center;
    text-shadow: 0 0 18px rgba(104, 255, 138, .5);
}

.victory-subtitle {
    color: #c1d8c5;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-align: center;
}

.victory-stars {
    color: #ffdc79;
    font-size: 22px;
    animation: starsGlow 1.5s ease-in-out infinite alternate;
}

@keyframes starsGlow {
    from { opacity: .55; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1.04); }
}

/* Final winner menu */
#overlay-screen.showVictory {
    z-index: 25;
    overflow: hidden;
    padding: 18px 12px;
    background:
        linear-gradient(rgba(1, 10, 6, .78), rgba(1, 8, 5, .94)),
        url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=85")
        center / cover no-repeat;
}

/* Purana bahut bright yellow sweep hatao */
#overlay-screen.showVictory::after {
    content: none;
}

#overlay-screen.showVictory #winner-text {
    position: relative;
    z-index: 2;
    margin: 0 0 8px;
    padding: 0 8px;
    color: #f1ffe9;
    font-size: clamp(24px, 6vw, 42px);
    line-height: 1.15;
    text-shadow: 0 0 18px rgba(98, 255, 133, .48);
}

#overlay-screen.showVictory #winnerEffects {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 0 0 12px;
    font-size: initial;
    animation: popIn .6s ease-out;
}

.winner-hero {
    position: relative;
    width: min(66vw, 270px);
    height: min(35vh, 260px);
    display: grid;
    place-items: center;
}

.winner-hero img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 18px rgba(135, 255, 155, .55));
    animation: championDance .48s ease-in-out infinite alternate;
}

.winner-hero .winner-fallback {
    display: none;
    width: 100%;
    height: 100%;
    place-items: center;
    font-size: 90px;
}

.winner-trophy-large {
    position: absolute;
    right: -5px;
    bottom: 0;
    font-size: clamp(38px, 10vw, 60px);
    filter: drop-shadow(0 0 12px rgba(255, 213, 69, .7));
    animation: trophyBounce .7s ease-in-out infinite alternate;
}

.winner-champion-tag {
    color: #d8ffde;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(110, 255, 145, .5);
}

#overlay-screen.showVictory #btn-restart {
    position: relative;
    z-index: 3;
    margin-top: 10px;
}

@media (prefers-reduced-motion: reduce) {
    .victory-stage,
    .victory-character,
    .victory-ring,
    .victory-trophy,
    .victory-stars,
    .winner-hero img,
    .winner-trophy-large {
        animation: none !important;
    }
}
/* ===== FLOATING BOMB SQUAD MENU BOMBS ===== */
#main-menu .menu-bomb {
    position: absolute;
    z-index: 1;
    top: 50%;
    display: block;
    font-family: "Noto Color Emoji", "Apple Color Emoji", sans-serif;
    font-size: clamp(58px, 13vw, 112px);
    line-height: 1;
    opacity: .96;
    pointer-events: none;

<script>

/* ===== CANVAS & BASIC SETUP ===== */
const canvas = document.getElementById('gameCanvas');

function loadPlayerImages() {
    for (let i = 1; i <= 4; i++) {
        const img = new Image();

/* ===== BUILT-IN SOUND FX: NO EXTERNAL FILES ===== */
// IMPORTANT: soundEnabled yahan dobara declare NAHI karna.
let audioCtx = null;

function unlockGameAudio() {
    if (!soundEnabled) return;

    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        if (!audioCtx) audioCtx = new AudioContextClass();

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    } catch (e) {
        console.warn('Audio unavailable:', e);
    }
}


function tone(freq, duration, type = 'sine', volume = 0.12,
              endFreq = null, delay = 0) {
    if (!soundEnabled) return;

    unlockGameAudio();
    if (!audioCtx) return;

    const start = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(1, freq), start);

    if (endFreq !== null) {
        osc.frequency.exponentialRampToValueAtTime(
            Math.max(1, endFreq), start + duration
        );
    }

    gain.gain.setValueAtTime(0.001, start);
    gain.gain.exponentialRampToValueAtTime(
        Math.max(0.001, volume), start + 0.015
    );
    gain.gain.exponentialRampToValueAtTime(
        0.001, start + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(start);
    osc.stop(start + duration + 0.03);
}

function noiseBurst(duration = 0.2, volume = 0.12) {
    if (!soundEnabled) return;

    unlockGameAudio();
    if (!audioCtx) return;

    const length = Math.max(
        1, Math.floor(audioCtx.sampleRate * duration)
    );

    const buffer = audioCtx.createBuffer(
        1, length, audioCtx.sampleRate
    );
    const data = buffer.getChannelData(0);

    for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) *
                  (1 - i / length);
    }

    const source = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();

    source.buffer = buffer;
    gain.gain.value = volume;

    source.connect(gain);
    gain.connect(audioCtx.destination);
    source.start();
}
function playDeathScream() {
if (!soundEnabled) return;

unlockGameAudio();
if (!audioCtx) return;

const start = audioCtx.currentTime;
const duration = 0.95;

// Main horror scream
const scream = audioCtx.createOscillator();
const gain = audioCtx.createGain();

scream.type = 'sawtooth';
scream.frequency.setValueAtTime(780, start);
scream.frequency.exponentialRampToValueAtTime(
    1050, start + 0.12
);
scream.frequency.exponentialRampToValueAtTime(
    280, start + duration
);

// Cheekh mein natural wavering effect
const vibrato = audioCtx.createOscillator();
const vibratoGain = audioCtx.createGain();

vibrato.frequency.value = 13;
vibratoGain.gain.value = 35;

vibrato.connect(vibratoGain);
vibratoGain.connect(scream.frequency);

gain.gain.setValueAtTime(0.001, start);
gain.gain.linearRampToValueAtTime(0.13, start + 0.08);
gain.gain.setValueAtTime(0.11, start + 0.30);
gain.gain.exponentialRampToValueAtTime(
    0.001, start + duration
);

scream.connect(gain);
gain.connect(audioCtx.destination);

vibrato.start(start);
scream.start(start);

scream.stop(start + duration);
vibrato.stop(start + duration);

}

function setupJoystick(pNum, baseId, stickId) {
    const base = document.getElementById(baseId);
    const stick = document.getElementById(stickId);
    if (!base || !stick) return;

    let active = false;
    let startX = 0, startY = 0;
    const maxDistance = 40;

    const handleStart = (e) => {
        active = true;
        const touch = e.touches ? e.touches[0] : e;
        const rect = base.getBoundingClientRect();
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
        handleMove(e);
    };

    const handleMove = (e) => {
        if (!active) return;
        const touch = e.touches ? e.touches[0] : e;
        let deltaX = touch.clientX - startX;
        let deltaY = touch.clientY - startY;
        let dist = Math.hypot(deltaX, deltaY);

        if (dist > maxDistance) {
            deltaX = (deltaX / dist) * maxDistance;
            deltaY = (deltaY / dist) * maxDistance;
        }

        stick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
        joyState[`p${pNum}`] = { x: deltaX / maxDistance, y: deltaY / maxDistance };
    };

    const handleEnd = () => {
        active = false;
        stick.style.transform = `translate(0px, 0px)`;
        joyState[`p${pNum}`] = { x: 0, y: 0 };
    };

    base.addEventListener('touchstart', handleStart);
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('touchend', handleEnd);
    base.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
}

function generateRandomMap() {
    grid = Array.from(
        { length: GRID_SIZE },

    for (let r = 0; r < GRID_SIZE; r++) {

            ) {

        }
    }

    // NATURAL TREE / ROCK CLUSTERS
    for (let r = 2; r < GRID_SIZE - 2; r++) {
        for (let c = 2; c < GRID_SIZE - 2; c++) {

            // keep broad natural corridors
            const corridor =
                Math.abs(r - 8) <= 1 ||
                Math.abs(c - 8) <= 1;

            if (corridor) continue;

            
if (Math.random() < 0.10) {
    // Jungle ke natural trees bhi bomb se toot sakein
    grid[r][c] = 2;
}

        }
    }

    // SAFE SPAWN AREAS
    const safeZones = [
        { r: 1, c: 1 },
        { r: 1, c: GRID_SIZE - 2 },
        { r: GRID_SIZE - 2, c: 1 },
        { r: GRID_SIZE - 2, c: GRID_SIZE - 2 }
    ];

    safeZones.forEach(s => {
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {

                const r = s.r + dr;
                const c = s.c + dc;

                if (
                    r > 0 &&
                    r < GRID_SIZE - 1 &&
                    c > 0 &&
                    c < GRID_SIZE - 1
                ) {
                    grid[r][c] = 0;
                }
            }
        }
    });

    // NATURAL BUSHES / BREAKABLE VEGETATION
    for (let r = 1; r < GRID_SIZE - 1; r++) {
        for (let c = 1; c < GRID_SIZE - 1; c++) {

            if (grid[r][c] !== 0) continue;

            const nearSpawn = safeZones.some(s =>
                Math.abs(s.r - r) <= 1 &&
                Math.abs(s.c - c) <= 1
            );

            if (nearSpawn) continue;

            // Keep central area open
            if (
                Math.abs(r - 8) <= 1 &&
                Math.abs(c - 8) <= 1
            ) {
                continue;
            }

            if (Math.random() < 0.30) {
                grid[r][c] = 2;
            }
        }
    }
// REALISTIC BREAKABLE BOULDERS — grid type 3
for (let r = 2; r < GRID_SIZE - 2; r++) {
    for (let c = 2; c < GRID_SIZE - 2; c++) {
        if (grid[r][c] !== 0) continue;

        // Keep main corridors clear
        if (Math.abs(r - 8) <= 1 || Math.abs(c - 8) <= 1) {
            continue;
        }

        // Keep the spawn areas clear
        const nearSpawn = spawnPoints.some(s =>
            Math.abs(s.r - r) <= 2 &&
            Math.abs(s.c - c) <= 2
        );

        if (nearSpawn) continue;

        // Some empty tiles become breakable rocks
        if (Math.random() < 0.10) {
            grid[r][c] = 3;
        }
    }
}
    // GUARANTEED OPEN CENTRAL JUNGLE AREA
    for (let r = 7; r <= 9; r++) {
        for (let c = 7; c <= 9; c++) {
            grid[r][c] = 0;
        }
    }

    // GUARANTEED ESCAPE CORRIDORS FROM EACH SPAWN

        [[1,1],[1,2],[2,1],[1,3],[3,1]],
        [[1,15],[1,14],[2,15],[1,13],[3,15]],
        [[15,1],[14,1],[15,2],[13,1],[15,3]],
        [[15,15],[14,15],[15,14],[13,15],[15,13]]
    ];

    routes.forEach(route => {
        route.forEach(([r, c]) => {
            if (
                r > 0 &&
                r < GRID_SIZE - 1 &&
                c > 0 &&
                c < GRID_SIZE - 1
            ) {
                grid[r][c] = 0;
            }
        });
    });

    // Make sure map is not completely blocked around center
    for (let r = 6; r <= 10; r++) {
        for (let c = 6; c <= 10; c++) {
            if (Math.random() < 0.65) {
                grid[r][c] = 0;

    const master = ac.createGain();
    master.gain.value = 1.08;

    bass.connect(lofi);

    master.connect(ac.destination);

    const output = bass;

function routeAudioFileThroughLofi(audio) {
    try {
        unlockGameAudio();
        if (!audioCtx) return;

        if (lofiAudioSources.has(audio)) return;

        const source = audioCtx.createMediaElementSource(audio);
        source.connect(getLofiOutput(audioCtx));

        lofiAudioSources.set(audio, source);
    } catch (error) {
        console.warn('Lo-Fi audio routing:', error);
    }
}

function playNoFolderPlaceSound() {

        if (!AC) return;

        if (!window.noFolderAudioCtx) {
            window.noFolderAudioCtx = new AC();
        }

        const ctx = window.noFolderAudioCtx;
        if (ctx.state === 'suspended') ctx.resume();

        const t = ctx.currentTime;

        // Short, punchy mechanical bomb-placement sound
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(125, t);
        osc.frequency.exponentialRampToValueAtTime(62, t + 0.12);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.38, t + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(t);
        osc.stop(t + 0.17);

        // Chhota metal click
        const click = ctx.createOscillator();
        const clickGain = ctx.createGain();

        click.type = 'square';
        click.frequency.setValueAtTime(850, t);
        click.frequency.exponentialRampToValueAtTime(320, t + 0.035);

        clickGain.gain.setValueAtTime(0.10, t);
        clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);

        click.connect(clickGain);
        clickGain.connect(ctx.destination);

        click.stop(t + 0.045);

    } catch (error) {

        if (!AC) return;

        if (!window.jungleBlastAudio) {
            window.jungleBlastAudio = new AC();
        }

        const ac = window.jungleBlastAudio;
        if (ac.state === 'suspended') ac.resume();

        const t = ac.currentTime;

        // Deep explosion boom
        const boom = ac.createOscillator();
        const boomGain = ac.createGain();

        boom.type = 'sine';
        boom.frequency.setValueAtTime(95, t);
        boom.frequency.exponentialRampToValueAtTime(28, t + 0.68);

        boomGain.gain.setValueAtTime(0.001, t);
        boomGain.gain.linearRampToValueAtTime(4.65, t + 0.618);
boomGain.gain.exponentialRampToValueAtTime(0.121, t + 2.68);

        boom.connect(boomGain);
        boomGain.connect(ac.destination);
        boom.start(t);
        boom.stop(t + 0.56);

        // Short noisy explosion crack
        const length = Math.floor(ac.sampleRate * 0.42);
        const buffer = ac.createBuffer(1, length, ac.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < length; i++) {
            data[i] = (Math.random() * 2 - 1) *
                (1 - i / length);
        }

        const noise = ac.createBufferSource();
        const filter = ac.createBiquadFilter();
        const noiseGain = ac.createGain();

        noise.buffer = buffer;
        filter.type = 'lowpass';
        filter.frequency.value = 1400;

        noiseGain.gain.setValueAtTime(0.001, t);
        noiseGain.gain.linearRampToValueAtTime(0.60, t + 0.008);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ac.destination);

        noise.start(t);
        noise.stop(t + 0.23);

    } catch (error) {
        console.warn('Blast sound error:', error);
    }
}

    this.lastX = this.x;

        this.aiTarget = null;

        this.aiEscapeMode =
            isTileInBlastZone(pos.r, pos.c) ||
            bombs.some(b => b.r === pos.r && b.c === pos.c);

        this.stuckTime = 0;
    }

function isTileInBlastZone(r, c) {
    for (let b of bombs) {
        if (b.r === r && b.c === c) return true;
        const dirs = [{r: 0, c: 1}, {r: 0, c: -1}, {r: 1, c: 0}, {r: -1, c: 0}];
        for (let d of dirs) {
            for (let i = 1; i <= b.range; i++) {
                const tr = b.r + d.r * i;
                const tc = b.c + d.c * i;
                if (tr < 0 || tr >= GRID_SIZE || tc < 0 || tc >= GRID_SIZE) break;
                if (grid[tr][tc] === 1) break;
                if (tr === r && tc === c) return true;
                if (grid[tr][tc] === 2 || grid[tr][tc] === 3) break;
            }
        }
    }
    return false;
}

function findNearestSafeTile(startR, startC) {
    const queue = [{ r: startR, c: startC }];
    const visited = new Set([`${startR},${startC}`]);

    while (queue.length > 0) {
        const current = queue.shift();

        if (!isTileInBlastZone(current.r, current.c)) {
            return current;
        }

        const dirs = [{r: 0, c: 1}, {r: 0, c: -1}, {r: 1, c: 0}, {r: -1, c: 0}];
        for (let d of dirs) {
            const nr = current.r + d.r;
            const nc = current.c + d.c;
            const key = `${nr},${nc}`;

            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && !visited.has(key)) {
                if (grid[nr][nc] === 0) {
                    visited.add(key);
                    queue.push({ r: nr, c: nc });
                }
            }
        }
    }
    return null;
}

function findNearestSafeTileAfterBomb(startR, startC, range) {
    const simBomb = { r: startR, c: startC, range: range };
    bombs.push(simBomb);
    const safeTile = findNearestSafeTile(startR, startC);
    bombs.pop();
    return safeTile;
}

function checkAdjacentBoxOrPlayer(r, c) {
    const dirs = [{r: 0, c: 1}, {r: 0, c: -1}, {r: 1, c: 0}, {r: -1, c: 0}];
    for (let d of dirs) {
        const tr = r + d.r;
        const tc = c + d.c;
        if (tr >= 0 && tr < GRID_SIZE && tc >= 0 && tc < GRID_SIZE) {
            if (grid[tr][tc] === 2) return true;
            const enemy = players.find(p => p.alive && !p.isBot && p.getGridPos().r === tr && p.getGridPos().c === tc);
            if (enemy) return true;
        }
    }
    return false;
}

function getRandomWalkableTile(r, c) {
    const dirs = [{r: 0, c: 1}, {r: 0, c: -1}, {r: 1, c: 0}, {r: -1, c: 0}];
    const validDirs = dirs.filter(d => {

                c: n.c,
                score: 60 - dist * 3
            });
        });
    }

    if (candidates.length === 0) {
        return getRandomWalkableTile(
            pos.r,
            pos.c
        );
    }

    candidates.sort(
        (a, b) => b.score - a.score
    );

    // Don't make every bot choose exactly the same target
    const top =
        candidates.slice(
            0,
            Math.min(5, candidates.length)
        );

    const selected =
        top[
            Math.floor(
                Math.random() * top.length
            )
        ];

    return {
        r: selected.r,
        c: selected.c
    };
}


function findBotPath(
    startR,
    startC,
    targetR,
    targetC,
    bot
) {

    if (
        startR < 1 ||
        startR >= GRID_SIZE - 1 ||
        startC < 1 ||
        startC >= GRID_SIZE - 1 ||
        targetR < 1 ||
        targetR >= GRID_SIZE - 1 ||
        targetC < 1 ||
        targetC >= GRID_SIZE - 1
    ) {
        return [];
    }

    if (
        startR === targetR &&
        startC === targetC
    ) {
        return [];
    }

    if (
        grid[targetR][targetC] !== 0
    ) {
        return [];
    }

    const queue = [
        {
            r: startR,
            c: startC
        }
    ];

    let head = 0;

    const visited =
        new Set([
            `${startR},${startC}`
        ]);

    const parent =
        new Map();

    const dirs = [
        { r: -1, c: 0 },
        { r: 1, c: 0 },
        { r: 0, c: -1 },
        { r: 0, c: 1 }
    ];

    while (head < queue.length) {

        const current =
            queue[head++];

        for (const d of dirs) {

            const nr =
                current.r + d.r;

            const nc =
                current.c + d.c;

            if (
                nr < 1 ||
                nr >= GRID_SIZE - 1 ||
                nc < 1 ||
                nc >= GRID_SIZE - 1
            ) {
                continue;
            }

            const key =
                `${nr},${nc}`;

            if (visited.has(key)) {
                continue;
            }

            if (grid[nr][nc] !== 0) {
                continue;
            }

            // Bomb tile blocked
            if (
                bombs.some(
                    b =>
                        b.r === nr &&
                        b.c === nc
                )
            ) {
                continue;
            }

            // Blast blocked
            if (
                isTileInBlastZone(
                    nr,
                    nc
                )
            ) {
                continue;
            }

            visited.add(key);

            parent.set(
                key,
                {
                    r: current.r,
                    c: current.c
                }
            );

            // Target mil gaya
            if (
                nr === targetR &&
                nc === targetC
            ) {

                const path = [];

                let cr = nr;
                let cc = nc;

                while (
                    cr !== startR ||
                    cc !== startC
                ) {

                    path.push({
                        r: cr,
                        c: cc
                    });

                    const p =
                        parent.get(
                            `${cr},${cc}`
                        );

                    if (!p) {
                        return [];
                    }

                    cr = p.r;
                    cc = p.c;
                }

                path.reverse();

                return path;
            }

            queue.push({
                r: nr,
                c: nc
            });
        }
    }

    return [];
}
// ===== DASH: PUSH A NEARBY BOMB =====
function pushNearbyBomb(player, dx, dy) {
    if (!player || player.bombPushTimer <= 0) return;
    if (dx === 0 && dy === 0) return;

    const px = player.x;
    const py = player.y;

    let nearest = null;
    let nearestDistance = tileSize * 0.85;

    for (const b of bombs) {
        const bx = b.c * tileSize + tileSize / 2;
        const by = b.r * tileSize + tileSize / 2;
        const distance = Math.hypot(px - bx, py - by);

        if (distance < nearestDistance) {
            nearest = b;
            nearestDistance = distance;
        }
    }

    if (!nearest) return;

    let nr = nearest.r;
    let nc = nearest.c;

    if (Math.abs(dx) >= Math.abs(dy)) {
        nc += Math.sign(dx);
    } else {
        nr += Math.sign(dy);
    }

    // Bomb walls, blocks ya doosri bomb ke andar nahi jayegi
    if (
        nr < 1 || nr >= GRID_SIZE - 1 ||
        nc < 1 || nc >= GRID_SIZE - 1 ||
        grid[nr][nc] !== 0 ||
        bombs.some(b => b !== nearest && b.r === nr && b.c === nc)
    ) {
        return;
    }

    nearest.r = nr;
    nearest.c = nc;
}
function checkCollision(x, y, player) {
const radius = tileSize * 0.16;

const points = [
    { x: x - radius, y: y - radius },
    { x: x + radius, y: y - radius },
    { x: x - radius, y: y + radius },
    { x: x + radius, y: y + radius },

    // Extra points for smoother wall collision
    { x: x, y: y - radius },
    { x: x, y: y + radius },
    { x: x - radius, y: y },
    { x: x + radius, y: y }
];

for (const p of points) {
    const c = Math.floor(p.x / tileSize);
    const r = Math.floor(p.y / tileSize);

    // Map boundary check
    if (
        r < 0 ||
        r >= GRID_SIZE ||
        c < 0 ||
        c >= GRID_SIZE
    ) {
        return true;
    }

    const isBorder =
        r === 0 ||
        c === 0 ||
        r === GRID_SIZE - 1 ||
        c === GRID_SIZE - 1;

    if (grid[r][c] === 1 && isBorder) {
        return true;
    }

    // Wall, tree or obstacle collision
    if (
        grid[r][c] === 1 ||
        grid[r][c] === 2 ||
        grid[r][c] === 3
    ) {
        return true;
    }
}

// Koi collision nahi hui
return false;

}

function updateGameObjects() {
    // Bomb timers and explosions
    for (let i = bombs.length - 1; i >= 0; i--) {
        const b = bombs[i];

        b.timer--;
        b.scale = 1 + Math.sin(b.timer * 0.25) * 0.08;

        if (b.timer <= 0) {
            if (b.owner) {
    b.owner.activeBombs = Math.max(
        0,
        b.owner.activeBombs - 1
    );
}
            

            triggerExplosion(b.r, b.c, b.range, b.owner);
            bombs.splice(i, 1);
        }
    }

    // Rock fragments animate EVERY frame
    for (let i = rockDebris.length - 1; i >= 0; i--) {
        const d = rockDebris[i];

        d.x += d.vx;
        d.y += d.vy;
        d.vy += 0.18;
        d.vx *= 0.97;
        d.life--;

        if (d.life <= 0) {
            rockDebris.splice(i, 1);
        }
    }

    // Explosion timers and one hit per explosion tile
    // ===== EXPLOSION: ONE HIT PER TILE PER PLAYER =====
for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.timer--;

    if (!ex.hitPlayers) {
        ex.hitPlayers = new Set();
    }

    players.forEach(p => {
        if (!p.alive) return;
        if (ex.hitPlayers.has(p.id)) return;

        const pPos = p.getGridPos();

        if (pPos.r === ex.r && pPos.c === ex.c) {
            ex.hitPlayers.add(p.id);
            p.takeDamage();
        }
    });

    if (ex.timer <= 0) {
        explosions.splice(i, 1);
    }
}
}

                    bush.addColorStop(
                        1,
                        '#263b2a'
                    );
                }

                g.fillStyle = bush;

                g.beginPath();

                g.arc(
                    x - tileSize * 0.20,
                    y + tileSize * 0.04,
                    tileSize * 0.22,
                    0,
                    Math.PI * 2
                );

                g.arc(
                    x + tileSize * 0.20,
                    y + tileSize * 0.03,
                    tileSize * 0.23,
                    0,
                    Math.PI * 2
                );

                g.arc(
                    x,
                    y - tileSize * 0.16,
                    tileSize * 0.25,
                    0,
                    Math.PI * 2
                );

                g.fill();
            }
        }



        // REALISTIC SOLID BOULDERS — grid === 3
        for (let r = 1; r < GRID_SIZE - 1; r++) {
            for (let c = 1; c < GRID_SIZE - 1; c++) {
                if (grid[r][c] !== 3) continue;

                const x = c * tileSize + tileSize / 2;
                const y = r * tileSize + tileSize / 2;
                const seed = Math.abs(Math.sin(r * 17.71 + c * 41.23));

                // Ground shadow
                g.fillStyle = 'rgba(0,0,0,0.48)';
                g.beginPath();
                g.ellipse(
                    x + 2, y + tileSize * 0.22,
                    tileSize * 0.43, tileSize * 0.22,
                    0, 0, Math.PI * 2
                );
                g.fill();

                // Rock body gradient
                const rock = g.createLinearGradient(
                    x - tileSize * 0.38,
                    y - tileSize * 0.36,
                    x + tileSize * 0.30,
                    y + tileSize * 0.34
                );

                if (jungleWeather === 2) {
                    rock.addColorStop(0, '#f0f3f1');
                    rock.addColorStop(0.28, '#b9c4c0');
                    rock.addColorStop(0.68, '#778580');
                    rock.addColorStop(1, '#414c49');
                } else {
                    rock.addColorStop(0, '#b7b8b1');
                    rock.addColorStop(0.25, '#777b78');
                    rock.addColorStop(0.65, '#505552');
                    rock.addColorStop(1, '#292e2d');
                }

                g.fillStyle = rock;
                g.beginPath();
                g.moveTo(x - tileSize * 0.40, y + tileSize * 0.08);
                g.lineTo(x - tileSize * 0.32, y - tileSize * 0.19);
                g.lineTo(x - tileSize * 0.12, y - tileSize * 0.39);
                g.lineTo(x + tileSize * 0.16, y - tileSize * 0.34);
                g.lineTo(x + tileSize * 0.39, y - tileSize * 0.09);
                g.lineTo(x + tileSize * 0.34, y + tileSize * 0.19);
                g.lineTo(x + tileSize * 0.08, y + tileSize * 0.34);
                g.lineTo(x - tileSize * 0.22, y + tileSize * 0.29);
                g.closePath();
                g.fill();

                // Upper highlight
                g.strokeStyle = 'rgba(255,255,255,0.30)';
                g.lineWidth = 1.5;
                g.beginPath();
                g.moveTo(x - tileSize * 0.28, y - tileSize * 0.17);
                g.lineTo(x - tileSize * 0.10, y - tileSize * 0.32);
                g.lineTo(x + tileSize * 0.12, y - tileSize * 0.27);
                g.stroke();

                // Natural cracks
                g.strokeStyle = 'rgba(20,24,23,0.60)';
                g.lineWidth = 1.2;
                g.beginPath();
                g.moveTo(x - tileSize * 0.04, y - tileSize * 0.17);
                g.lineTo(x + tileSize * 0.03, y);
                g.lineTo(x - tileSize * 0.04, y + tileSize * 0.13);
                g.moveTo(x + tileSize * 0.15, y - tileSize * 0.04);
                g.lineTo(x + tileSize * 0.23, y + tileSize * 0.08);
                g.stroke();

                // Tiny mineral highlights
                g.fillStyle = 'rgba(255,255,255,0.22)';
                g.fillRect(
                    x - tileSize * 0.20,
                    y - tileSize * 0.12,
                    Math.max(1, tileSize * 0.035),
                    Math.max(1, tileSize * 0.035)
                );
            }
        }



        // =================================================
        // SMALL RIVER / WATER PATCH
        //
        // ONLY DRAWING.
        // GRID CHANGE NAHI.
        // Isliye player/bot stuck nahi honge.
        // =================================================

        const riverX =
            off.width * 0.76;

        const riverTop =
            off.height * 0.12;

        const riverBottom =
            off.height * 0.88;

        const riverWidth =
            Math.max(
                12,
                tileSize * 0.42
            );

        const water =
            g.createLinearGradient(
                riverX - riverWidth,
                0,
                riverX + riverWidth,
                0
            );

        water.addColorStop(
            0,
            'rgba(45,76,72,0)'
        );

        water.addColorStop(
            0.35,
            'rgba(55,105,105,0.55)'
        );

        water.addColorStop(
            0.5,
            'rgba(85,135,132,0.72)'
        );

        water.addColorStop(
            0.65,
            'rgba(55,105,105,0.55)'
        );

        water.addColorStop(
            1,
            'rgba(45,76,72,0)'
        );

        g.fillStyle = water;

        g.beginPath();

        g.moveTo(
            riverX - riverWidth,
            riverTop
        );

        g.bezierCurveTo(
            riverX - riverWidth * 0.4,
            off.height * 0.30,
            riverX + riverWidth * 0.55,
            off.height * 0.42,
            riverX - riverWidth * 0.1,
            off.height * 0.58
        );

        g.bezierCurveTo(
            riverX - riverWidth * 0.5,
            off.height * 0.72,
            riverX + riverWidth * 0.4,
            off.height * 0.80,
            riverX + riverWidth * 0.15,
            riverBottom
        );

        g.lineTo(
            riverX - riverWidth,
            riverBottom
        );

        g.closePath();

        g.fill();


        // River highlights
        g.strokeStyle =
            'rgba(180,225,220,0.30)';

        g.lineWidth = 1.2;

        for (let i = 0; i < 5; i++) {

            const yy =
                riverTop +
                ((riverBottom - riverTop) / 6) *
                (i + 1);

            g.beginPath();

            g.moveTo(
                riverX - riverWidth * 0.30,
                yy
            );

            g.quadraticCurveTo(
                riverX,
                yy - 3,
                riverX + riverWidth * 0.30,
                yy
            );

            g.stroke();
        }


        // =================================================
        // RIVER BANK MOSS / MUD
        // =================================================

        g.strokeStyle =
            'rgba(68,58,40,0.30)';

        g.lineWidth = 3;

        g.beginPath();

        g.moveTo(
            riverX - riverWidth * 0.75,
            riverTop
        );

        g.bezierCurveTo(
            riverX - riverWidth * 0.3,
            off.height * 0.35,
            riverX + riverWidth * 0.3,
            off.height * 0.52,
            riverX - riverWidth * 0.2,
            riverBottom
        );

        g.stroke();


        // =================================================
        // WEATHER ATMOSPHERE
        // =================================================

        if (jungleWeather === 1) {

            // Dark rainy atmosphere
            g.fillStyle =
                'rgba(20,35,40,0.16)';

            g.fillRect(
                0,
                0,
                off.width,
                off.height
            );

        } else if (jungleWeather === 2) {

            // Cold snow atmosphere
            g.fillStyle =
                'rgba(225,240,238,0.10)';

            g.fillRect(
                0,
                0,
                off.width,
                off.height
            );
        }


        // =================================================
        // VIGNETTE
        // =================================================

                const vignette =
            g.createRadialGradient(
                off.width / 2,
                off.height / 2,
                off.width * 0.25,
                off.width / 2,
                off.height / 2,
                off.width * 0.75
            );

        vignette.addColorStop(
            0,
            'rgba(0,0,0,0)'
        );

        vignette.addColorStop(
            0.72,
            'rgba(0,20,5,0.04)'
        );

        vignette.addColorStop(
            1,
            'rgba(0,15,5,0.25)'
        );

        g.fillStyle =
            vignette;

        g.fillRect(
            0,
            0,
            off.width,
            off.height
        );

        // ================================================
        // SAVE JUNGLE MAP CACHE
        // ================================================

        window.jungleMapCache = {
            canvas: off,
            signature: signature,
            width: canvas.width
        };
    }

    // ================================================
    // DRAW CACHED JUNGLE MAP
    // ================================================

    ctx.drawImage(
        window.jungleMapCache.canvas,
        0,
        0
    );
}



function drawRainOnCharacters() {
    if (jungleWeather !== 1) return;

    const now = performance.now() * 0.001;

    if (!window.jungleCharacterRainStart) {
        window.jungleCharacterRainStart = now;
    }

    const rainAge = now - window.jungleCharacterRainStart;
    
const intensity = Math.min(0.45, rainAge / 8);


    players.forEach(p => {
        if (!p || !p.alive) return;

        const x = p.x;
        const y = p.y;
        const radius = tileSize * (p.isGrown ? 0.95 : 0.76);

        ctx.save();
        ctx.lineCap = 'round';

        // Character PNG ke upar diagonal rain drops
        ctx.strokeStyle =
            
`rgba(190, 225, 255, ${0.08 + intensity * 0.12})`;

        ctx.lineWidth = 1.15;

        for (let i = 0; i < 12; i++) {
            const phase = (now * (2.8 + i * 0.025) + i * 0.173) % 1;
            const offsetX = Math.sin(i * 12.3) * radius * 0.82;
            const dropY = y - radius + phase * radius * 2;

            
const dropX = x + offsetX - phase * radius * 0.55;


            ctx.beginPath();
            ctx.moveTo(dropX, dropY);
            ctx.lineTo(
                dropX - 1.5 - intensity * 2,
                dropY + 5 + intensity * 5
            );
            ctx.stroke();
        }

        // PNG ke edges par subtle wet shine
        ctx.strokeStyle = `rgba(155, 210, 255, ${0.10 + intensity * 0.16})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(
            x, y, radius * 0.91,
            Math.PI * 1.08, Math.PI * 1.88
        );
        ctx.stroke();

        // Pairon ke paas moving water splashes
        const footY = y + radius * 0.82;

        for (let i = 0; i < 3; i++) {
            const phase = now * 5.5 + i * 2.1 + p.id;
            const spread = 3 + (Math.sin(phase) + 1) * 4;
            const alpha = 0.18 + (Math.sin(phase * 1.7) + 1) * 0.12;

            ctx.strokeStyle = `rgba(195, 230, 255, ${alpha * intensity})`;
            ctx.lineWidth = 1.2;

            ctx.beginPath();
            ctx.ellipse(
                x + Math.sin(phase) * radius * 0.55,
                footY,
                spread,
                2.2,
                0, Math.PI, Math.PI * 2
            );
            ctx.stroke();
        }

        ctx.restore();
    });
}

function drawWindSwayTrees() {
    if (!grid || !tileSize) return;

    const now = performance.now() * 0.001;
    const wind = jungleWeather === 1 ? 1.0 : 0.55;

    for (let r = 1; r < GRID_SIZE - 1; r++) {
        for (let c = 1; c < GRID_SIZE - 1; c++) {
            if (grid[r][c] !== 1) continue;

            const x = c * tileSize + tileSize * 0.5;
            const y = r * tileSize + tileSize * 0.25;

            // Har tree ka sway phase alag rakho
            const phase = now * 1.7 + r * 1.31 + c * 0.83;
            const sway = Math.sin(phase) * tileSize * 0.055 * wind;
            const bob = Math.cos(phase * 0.7) * tileSize * 0.018;

            ctx.save();
            ctx.globalAlpha = 0.20;
            ctx.fillStyle = '#347342';

            // Moving leaf clusters
            for (let i = 0; i < 3; i++) {
                const offset = (i - 1) * tileSize * 0.16;

                ctx.beginPath();
                ctx.ellipse(
                    x + offset + sway,
                    y + bob - Math.abs(i - 1) * tileSize * 0.035,
                    tileSize * 0.17,
                    tileSize * 0.10,
                    sway / Math.max(1, tileSize) * 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }

            ctx.restore();
        }
    }
}

function drawBombsAndExplosions() {

    const now =
        performance.now() * 0.001;


    // =====================================================
    // REALISTIC BOMBS
    // =====================================================

    bombs.forEach(b => {

        const x =
            b.c * tileSize +
            tileSize / 2;

        const y =
            b.r * tileSize +
            tileSize / 2;

        const pulse =
            1 +
            Math.sin(
                now * 8 +
                b.r +
                b.c
            ) * 0.055;

        const blastLevel = Math.min(
    b.owner?.bombBlastLevel || 0,
    4
);

const radius =
    tileSize * 0.34 *
    (1 + blastLevel * 0.20);

        ctx.save();

        ctx.translate(x, y);
        ctx.scale(
            b.scale * pulse,
            b.scale * pulse
        );

        // Ground shadow
        ctx.save();
        ctx.scale(1, 0.35);

        const shadow =
            ctx.createRadialGradient(
                0,
                0,
                1,
                0,
                0,
                radius * 1.35
            );

        shadow.addColorStop(
            0,
            'rgba(0,0,0,0.55)'
        );

        shadow.addColorStop(
            1,
            'rgba(0,0,0,0)'
        );

        ctx.fillStyle = shadow;

        ctx.beginPath();
        ctx.arc(
            0,
            radius * 0.9,
            radius * 1.35,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.restore();

        // Bomb body gradient
        const body =
            ctx.createRadialGradient(
                -radius * 0.35,
                -radius * 0.45,
                radius * 0.08,
                0,
                0,
                radius
            );

        body.addColorStop(
            0,
            '#69747a'
        );

        body.addColorStop(
            0.28,
            '#30383d'
        );

        body.addColorStop(
            0.72,
            '#111518'
        );

        body.addColorStop(
            1,
            '#050607'
        );

        ctx.fillStyle = body;

        ctx.beginPath();
        ctx.arc(
            0,
            0,
            radius,
            0,
            Math.PI * 2
        );
        ctx.fill();

        // Metallic outline
        ctx.lineWidth = Math.max(1.5, tileSize * 0.035);
        ctx.strokeStyle = '#050607';
        ctx.stroke();

        // Small highlight
        ctx.fillStyle =
            'rgba(255,255,255,0.25)';

        ctx.beginPath();
        ctx.ellipse(
            -radius * 0.35,
            -radius * 0.42,
            radius * 0.22,
            radius * 0.12,
            -0.45,
            0,
            Math.PI * 2
        );
        ctx.fill();

        // Fuse
        ctx.strokeStyle = '#8b6b3e';
        ctx.lineWidth = Math.max(
            2,
            tileSize * 0.035
        );

        ctx.beginPath();
        ctx.moveTo(0, -radius * 0.82);
        ctx.quadraticCurveTo(
            radius * 0.18,
            -radius * 1.18,
            radius * 0.34,
            -radius * 0.92
        );
        ctx.stroke();

        // Fuse glow
        const glowSize =
            5 +
            Math.sin(now * 16) * 2;

        ctx.shadowColor = '#ff4d00';
        ctx.shadowBlur = 12;

        ctx.fillStyle = '#ff6b00';

        ctx.beginPath();
        ctx.arc(
            radius * 0.34,
            -radius * 0.92,
            glowSize * 0.45,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.shadowBlur = 0;

        // Flame
        ctx.fillStyle = '#ffcc00';

        ctx.beginPath();
        ctx.arc(
            radius * 0.34,
            -radius * 0.96,
            2.5 + Math.random() * 2,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.restore();

        // Danger ring when timer is low
        if (b.timer < 45) {

            const danger =
                1 -
                b.timer / 45;

            ctx.save();

            ctx.strokeStyle =
                `rgba(255,40,20,${0.18 + danger * 0.45})`;

            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                tileSize *
                    (0.55 + danger * 0.35),
                0,
                Math.PI * 2
            );

            ctx.stroke();

            ctx.restore();
        }
    });


    // =====================================================
    // REALISTIC EXPLOSIONS
    // =====================================================

    explosions.forEach(ex => {

        const x =
            ex.c * tileSize +
            tileSize / 2;

        const y =
            ex.r * tileSize +
            tileSize / 2;

        const life =
            Math.max(
                0,
                Math.min(
                    1,
                    ex.timer / 22
                )
            );

        const progress =
            1 - life;

        const maxRadius =
    tileSize *
    (0.72 + progress * 0.18) *
    (1 + (ex.blastLevel || 0) * 0.18);
        ctx.save();

        // Explosion glow
        const glow =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                maxRadius * 1.5
            );

        glow.addColorStop(
            0,
            `rgba(255,255,220,${0.95 * life})`
        );

        glow.addColorStop(
            0.20,
            `rgba(255,225,55,${0.95 * life})`
        );

        glow.addColorStop(
            0.48,
            `rgba(255,100,10,${0.75 * life})`
        );

        glow.addColorStop(
            0.78,
            `rgba(255,35,5,${0.38 * life})`
        );

        glow.addColorStop(
            1,
            'rgba(255,0,0,0)'
        );

        ctx.fillStyle = glow;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            maxRadius * 1.5,
            0,
            Math.PI * 2
        );

        ctx.fill();


        // Jagged flame shape
        const spikes = 12;

        ctx.beginPath();

        for (let i = 0; i < spikes; i++) {

            const angle =
                (Math.PI * 2 * i) /
                spikes;

            const randomSize =
                0.72 +
                Math.sin(
                    i * 9.71 +
                    ex.timer
                ) * 0.18;

            const r =
                maxRadius *
                randomSize;

            const px =
                x +
                Math.cos(angle) * r;

            const py =
                y +
                Math.sin(angle) * r;

            if (i === 0) {
                ctx.moveTo(px, py);
            } else {
                ctx.lineTo(px, py);
            }
        }

        ctx.closePath();

        const fire =
            ctx.createRadialGradient(
                x,
                y,
                0,
                x,
                y,
                maxRadius
            );

        fire.addColorStop(
            0,
            `rgba(255,255,230,${life})`
        );

        fire.addColorStop(
            0.28,
            `rgba(255,220,30,${life})`
        );

        fire.addColorStop(
            0.62,
            `rgba(255,75,5,${life})`
        );

        fire.addColorStop(
            1,
            `rgba(170,10,0,${life * 0.55})`
        );

        ctx.fillStyle = fire;
        ctx.fill();


        // Hot white center
        ctx.fillStyle =
            `rgba(255,255,245,${life * 0.95})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            maxRadius * 0.25,
            0,
            Math.PI * 2
        );

        ctx.fill();


        // Shockwave
        ctx.strokeStyle =
            `rgba(255,190,40,${life * 0.65})`;

        ctx.lineWidth =
            Math.max(
                1.5,
                tileSize * 0.035
            );

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            maxRadius *
                (0.72 + progress * 0.7),
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();
    });
}

const jungleBirds = [];

function initJungleAmbience() {

    jungleBirds.length = 0;

    const count = 7;

    for (let i = 0; i < count; i++) {

        jungleBirds.push({

function playJungleThunder() {
    if (!soundEnabled) return;

    try {
        unlockGameAudio();

        if (!audioCtx) return;

        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const ac = audioCtx;
        const t = ac.currentTime + 0.05;
        const duration = 1.8;

        // Deep thunder rumble
        const rumble = ac.createOscillator();
        const rumbleGain = ac.createGain();
        const rumbleFilter = ac.createBiquadFilter();

        rumble.type = 'sine';
        rumble.frequency.setValueAtTime(62, t);
        rumble.frequency.exponentialRampToValueAtTime(27, t + 1.5);

        rumbleFilter.type = 'lowpass';
        rumbleFilter.frequency.value = 150;

        rumbleGain.gain.setValueAtTime(0.001, t);
        rumbleGain.gain.linearRampToValueAtTime(0.42, t + 0.09);
        rumbleGain.gain.setValueAtTime(0.25, t + 0.35);
        rumbleGain.gain.exponentialRampToValueAtTime(0.001, t + duration);

        rumble.connect(rumbleFilter);
        rumbleFilter.connect(rumbleGain);
        rumbleGain.connect(ac.destination);

        rumble.start(t);
        rumble.stop(t + duration);

        // Low-passed noise = thunder crack and distant rolling sound
        const length = Math.floor(ac.sampleRate * 1.15);
        const buffer = ac.createBuffer(1, length, ac.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < length; i++) {
            data[i] = (Math.random() * 2 - 1) *
                (1 - i / length);
        }

        const noise = ac.createBufferSource();
        const filter = ac.createBiquadFilter();
        const noiseGain = ac.createGain();

        noise.buffer = buffer;

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(850, t);
        filter.frequency.exponentialRampToValueAtTime(130, t + 1.1);

        noiseGain.gain.setValueAtTime(0.001, t);
        noiseGain.gain.linearRampToValueAtTime(0.24, t + 0.025);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 1.15);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ac.destination);

        noise.start(t);
        noise.stop(t + 1.2);

    } catch (error) {
        console.warn('Thunder sound error:', error);
    }
}

function processGhostRevives() {
    for (const p of players) {
        if (!p.revivePending) continue;

        p.reviveTimer--;

        if (p.reviveTimer > 0) continue;

        // Find a clear, safe tile for respawn
        let safeTile = null;

        for (const sp of spawnPoints) {
            if (
                grid[sp.r][sp.c] !== 0 ||
                bombs.some(b => b.r === sp.r && b.c === sp.c) ||
                explosions.some(e => e.r === sp.r && e.c === sp.c) ||
                players.some(other =>
                    other !== p &&
                    other.alive &&
                    other.getGridPos().r === sp.r &&
                    other.getGridPos().c === sp.c
                )
            ) {
                continue;
            }

            safeTile = sp;
            break;
        }

        // Agar spawn points occupied hon, map mein doosri safe tile dhoondo
        if (!safeTile) {
            for (let r = 1; r < GRID_SIZE - 1 && !safeTile; r++) {
                for (let c = 1; c < GRID_SIZE - 1; c++) {
                    if (grid[r][c] !== 0) continue;
                    if (bombs.some(b => b.r === r && b.c === c)) continue;
                    if (explosions.some(e => e.r === r && e.c === c)) continue;

                    const occupied = players.some(other =>
                        other !== p &&
                        other.alive &&
                        other.getGridPos().r === r &&
                        other.getGridPos().c === c
                    );

                    if (!occupied) {
                        safeTile = { r, c };
                        break;
                    }
                }
            }
        }

        // Safe tile na mile to revival pending rakho
        if (!safeTile) {
            p.reviveTimer = 30;
            continue;
        }

        p.x = safeTile.c * tileSize + tileSize / 2;
        p.y = safeTile.r * tileSize + tileSize / 2;
        p.hearts = 1;
        p.alive = true;
        p.revivePending = false;
        p.reviveTimer = 0;

        console.log('👻 PLAYER REVIVED:', p.id);
    }
}

function playCute321GoSound() {
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        if (!window._countdownAudio) {
            window._countdownAudio = new AC();
        }

        const ctx = window._countdownAudio;

        function tone(freq, time, duration, type, volume, endFreq) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = type || "sine";
            osc.frequency.setValueAtTime(freq, time);

            if (endFreq) {
                osc.frequency.exponentialRampToValueAtTime(
                    endFreq, time + duration
                );
            }

            gain.gain.setValueAtTime(0.001, time);
            gain.gain.exponentialRampToValueAtTime(
                volume, time + 0.125
            );
            gain.gain.exponentialRampToValueAtTime(
                0.001, time + duration
            );

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(time);
            osc.stop(time + duration + 0.03);
        }

        function startSound() {
            const t = ctx.currentTime + 0.05;

            // Cute suspense shimmer
            tone(440, t, 0.35, "sine", 0.16, 660);
            tone(880, t + 0.12, 0.45, "sine", 0.08, 1200);

            // Three rising countdown notes
            tone(523, t + 0.55, 0.24, "triangle", 0.30, 650);
            tone(659, t + 1.05, 0.24, "triangle", 0.32, 800);
            tone(784, t + 1.55, 0.30, "triangle", 0.34, 1050);

            // Exciting GO! sparkle + deep impact
            tone(1047, t + 2.05, 0.55, "sawtooth", 0.20, 1568);
            tone(130, t + 2.05, 0.50, "sine", 0.48, 48);
            tone(1568, t + 2.12, 0.37, "triangle", 0.20, 2093);
            tone(2200, t + 2.18, 0.22, "sine", 0.11, 1200);
        }

        if (ctx.state === "suspended") {
            ctx.resume().then(startSound).catch(() => {});
        } else {
            startSound();
        }
    } catch (e) {
        console.error("Countdown sound:", e);
    }
}

function test321Voice() {
    try {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
            alert("Audio supported nahi hai!");
            return;
        }

        const ctx = new AudioContextClass();

        ctx.resume().then(() => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(700, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(
                1100, ctx.currentTime + 0.25
            );

            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                0.01, ctx.currentTime + 0.6
            );

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        });
    } catch (e) {
        alert("Audio error: " + e.message);
    }
}

<script>
/* ===== ND REWARD TRACKER — shared by game pages ===== */
(function () {
    const GAME_ID = document.body.dataset.rewardGame;
    if (!GAME_ID) {
        console.warn("Reward tracker: data-reward-game missing");
        return;
    }

    const PREFIX = "nd_reward_activity_v2_";
    const uid =
        localStorage.getItem("nd_reward_uid_v1") || "guest";
    const storageKey = PREFIX + uid;

    let playing = false;
    let lastTick = 0;
    let timer = null;

    function readData() {
        try {
            const data = JSON.parse(localStorage.getItem(storageKey) || "{}");
            if (!data.secondsByGame) data.secondsByGame = {};
            if (!data.matchesByGame) data.matchesByGame = {};
            if (!data.winsByGame) data.winsByGame = {};
            return data;
        } catch (e) {
            return {
                secondsByGame: {},
                matchesByGame: {},
                winsByGame: {}
            };
        }
    }

    function flush() {
        if (!playing || document.hidden || !lastTick) return;

        const now = Date.now();
        const seconds = Math.min(5, Math.max(0, Math.floor((now - lastTick) / 1000)));
        lastTick = now;

        if (!seconds) return;

        const data = readData();
        data.secondsByGame[GAME_ID] =
            (Number(data.secondsByGame[GAME_ID]) || 0) + seconds;

        localStorage.setItem(storageKey, JSON.stringify(data));
    }

    window.NDRewardTracker = {
        startMatch() {
            playing = true;
            lastTick = Date.now();

            if (timer) clearInterval(timer);
            timer = setInterval(flush, 1000);
        },

        endMatch(won) {
            flush();
            playing = false;
            lastTick = 0;

            if (timer) {
                clearInterval(timer);
                timer = null;
            }

            const data = readData();
            data.matchesByGame[GAME_ID] =
                (Number(data.matchesByGame[GAME_ID]) || 0) + 1;

            if (won) {
                data.winsByGame[GAME_ID] =
                    (Number(data.winsByGame[GAME_ID]) || 0) + 1;
            }

            localStorage.setItem(storageKey, JSON.stringify(data));
        },

        addDistance(meters) {
            const data = readData();
            if (!data.metersByGame) data.metersByGame = {};
            data.metersByGame[GAME_ID] =
                (Number(data.metersByGame[GAME_ID]) || 0) +
                Math.max(0, Number(meters) || 0);
            localStorage.setItem(storageKey, JSON.stringify(data));
        }
    };

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            flush();
        } else if (playing) {
            lastTick = Date.now();
        }
    });

    window.addEventListener("beforeunload", flush);
})();
</script>
