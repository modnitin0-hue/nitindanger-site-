content="width=device-width,initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
background:#000;

}

body{

position:relative;

background:
radial-gradient(circle at top,
#5b1fa5 0%,
#2d1250 35%,
#14071f 70%,
#000 100%);

}

/* SKY */

.sky{

position:absolute;
left:0;
top:0;
width:100%;
height:100%;
overflow:hidden;

}

/* STARS */

#stars{

position:absolute;
width:100%;
height:100%;

}

.star{

position:absolute;
background:#fff;
border-radius:50%;
animation:twinkle 2s infinite alternate;

}

@keyframes twinkle{

from{

opacity:.25;

}

to{

opacity:1;

}

}

/* CLOUD */

.cloud{

position:absolute;

width:260%;
height:240px;

background:

radial-gradient(circle,
rgba(255,255,255,.22),
rgba(255,255,255,.06),
transparent 72%);

filter:blur(70px);

animation:cloudMove linear infinite;

}

.cloud:nth-child(1){

top:5%;
left:-180%;
animation-duration:60s;

}

.cloud:nth-child(2){

top:30%;
left:-170%;
animation-duration:75s;

opacity:.7;

}

.cloud:nth-child(3){

top:55%;
left:-200%;
animation-duration:65s;

opacity:.45;

}

@keyframes cloudMove{

100%{

transform:translateX(260%);

}

}

/* FOG */

.fog{

position:absolute;

left:-40%;
bottom:-5%;

width:180%;
height:260px;

background:

radial-gradient(circle,
rgba(255,255,255,.15),
transparent 70%);

filter:blur(90px);

animation:fogMove 14s infinite ease-in-out;

}

@keyframes fogMove{

0%{

transform:translateX(-8%);

}

50%{

transform:translateX(10%);

}

100%{

transform:translateX(-8%);

}

}

/* TORNADO */

.tornado{

position:absolute;

left:50%;
bottom:-250px;

width:700px;
height:700px;

transform:
translateX(-50%);

border-radius:50%;

background:

conic-gradient(

transparent,
rgba(255,255,255,.03),
transparent,
rgba(255,255,255,.07),
transparent);

filter:blur(2px);

animation:

spin 8s linear infinite;

opacity:.45;

}

@keyframes spin{

100%{

transform:
translateX(-50%)
rotate(360deg);

}

}

/* PARTICLES */

.particle{

position:absolute;

width:4px;
height:4px;

background:#fff;

border-radius:50%;

opacity:.8;

animation:
particleFloat linear infinite;

}

@keyframes particleFloat{

0%{

transform:
translateY(0);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:
translateY(-120vh);

opacity:0;

}

}
/* LOGO */

.logo{

position:absolute;

left:50%;
top:50%;

width:240px;

transform:
translate(-50%,-50%)
scale(.15);

opacity:0;

filter:

drop-shadow(0 0 20px #fff)
drop-shadow(0 0 45px #fff)
drop-shadow(0 0 90px rgba(255,255,255,.8));

animation:

logoIntro 2.8s forwards;

z-index:50;

}

@keyframes logoIntro{

0%{

opacity:0;

transform:
translate(-50%,-50%)
scale(.15)
rotate(-10deg);

}

45%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1.12)
rotate(3deg);

}

70%{

transform:
translate(-50%,-50%)
scale(.96);

}

100%{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

}

}

/* LIGHTNING */

.lightning{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

pointer-events:none;

z-index:30;

}

svg{

width:100%;
height:100%;

}

.bolt{

fill:none;

stroke:#fff;

stroke-width:3;

stroke-linecap:round;

stroke-linejoin:round;

filter:

drop-shadow(0 0 8px #fff)
drop-shadow(0 0 18px #fff)
drop-shadow(0 0 50px #fff);

stroke-dasharray:900;

stroke-dashoffset:900;

opacity:0;

animation:strike 7s infinite;

}

.bolt:nth-child(2){

animation-delay:3.3s;

}

@keyframes strike{

0%,90%{

opacity:0;

stroke-dashoffset:900;

}

91%{

opacity:1;

}

94%{

stroke-dashoffset:0;

}

97%{

opacity:1;

}

100%{

opacity:0;

}

}
</style>

    // 🕹️ JOYSTICK SIZE
    // ==================================================

    function addRange(
        icon,
        name,
        key,
        min,
        max,
        value
    ){

        const box =
            document.createElement("div");

        box.style.margin =
            "15px 0";

        const label =
            document.createElement("div");

        label.innerHTML =
            icon +
            " " +
            name +
            ": <b id='" +
            key +
            "Value'>" +
            value +
            "</b>";

        label.style.fontSize =
            "17px";

        label.style.marginBottom =
            "7px";

        box.appendChild(label);

        const range =
            document.createElement("input");

        range.type =
            "range";

        range.min =
            min;

        range.max =
            max;

        range.value =
            value;

        range.style.width =
            "100%";

        range.dataset.setting =
            key;

        range.oninput =
            function(){

                document.getElementById(
                    key+"Value"
                ).innerText =
                    this.value;

            };

        box.appendChild(range);

        panel.appendChild(box);

        return range;
    }

    const joystickSize =
        addRange(
            "🕹️",
            "Joystick Size",
            "duoJoystickSize",
            70,
            180,
            localStorage.getItem(

    const joystickSensitivity =
        addRange(

            50,
            200,

            localStorage.setItem(

                    save.innerHTML =
                        "💾 SAVE CONTROLS";

            localStorage.removeItem(

            localStorage.removeItem(

            location.reload();

    panel.appendChild(reset);

    // ==================================================

    // ==================================================

                    <div style="position:absolute;top:60px;width:26px;height:44px;background:#ef4444;border-radius:6px;animation:ndCar 2.5s ease-in-out infinite;box-shadow:0 0 0 3px #111, 0 0 12px #ef4444">
                        <div style="position:absolute;top:8px;left:3px;right:3px;height:12px;background:#93c5fd;border-radius:3px"></div>

                <!-- 3. SPACE SHOOTER GAME -->
                <div class="nd-card" style="background:linear-gradient(135deg,#020617,#0f172a)">
                    <div style="position:absolute;width:3px;height:3px;background:#fff;top:15px;left:20px"></div>
                    <div style="position:absolute;width:3px;height:3px;background:#fff;top:30px;left:70px"></div>
                    <div style="position:absolute;width:3px;height:3px;background:#fff;top:10px;left:85px"></div>
                    <div style="position:absolute;width:4px;height:12px;background:#facc15;left:50%;top:60px;animation:ndShoot 1s linear infinite"></div>

                <!-- 4. BRICK BREAKER GAME -->
                <div class="nd-card" style="background:linear-gradient(135deg,#3b0764,#7e22ce)">
                    <div style="position:absolute;top:15px;left:10px;right:10px;display:flex;gap:4px"><div style="flex:1;height:10px;background:#f472b6;border-radius:2px"></div><div style="flex:1;height:10px;background:#fb923c;border-radius:2px"></div><div style="flex:1;height:10px;background:#a3e635;border-radius:2px"></div></div>

                <div class="nd-card" style="background:linear-gradient(135deg,#111827,#1f2937)">

                    <div style="position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;top:45px;left:60px"></div>
                    <div style="position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;top:45px;left:75px"></div>
                    <div class="nd-title">PAC RUN</div>
                </div>
                <!-- 6. TETRIS GAME -->
                <div class="nd-card" style="background:linear-gradient(135deg,#082f49,#0c4a6e)">
                    <div style="position:absolute;top:20px;left:25px;display:grid;grid-template-columns:repeat(3,14px);gap:2px">
                        <div style="width:14px;height:14px;background:#22d3ee"></div><div style="width:14px;height:14px;background:#22d3ee"></div><div style="width:14px;height:14px;background:#22d3ee"></div>
                        <div style="width:14px;height:14px;background:transparent"></div><div style="width:14px;height:14px;background:#facc15"></div><div style="width:14px;height:14px;background:transparent"></div>
                    </div>
                    <div style="position:absolute;top:70px;left:45px;display:flex;gap:2px"><div style="width:14px;height:14px;background:#f472b6"></div><div style="width:14px;height:14px;background:#f472b6"></div></div>
                    <div class="nd-title">BLOCK PUZZLE</div>
                </div>
                <!-- Duplicate for loop - Taaki neeche se upar chalta rahe -->
                <div class="nd-card" style="background:linear-gradient(135deg,#052e16,#14532d)"><div class="nd-title">SNAKE</div></div>
                <div class="nd-card" style="background:linear-gradient(135deg,#1e1b4b,#312e81)"><div class="nd-title">CAR RACE</div></div>
                <div class="nd-card" style="background:linear-gradient(135deg,#020617,#0f172a)"><div class="nd-title">SPACE SHOOT</div></div>
            </div>
        `;
    }
    mainMenu.appendChild(cssLoop);

    // === NAYI VIDEO - Wo Purani Wali Nahi, Ye Bilkul Nayi Hai! ===
    const menuVideo = document.createElement("video");
    menuVideo.autoplay = true; menuVideo.muted = true; menuVideo.loop = true; menuVideo.playsInline = true;
    menuVideo.style.cssText = `position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.55;`;
    // NAYI VIDEO - Pexels wali, Pixabay wali nahi!
    menuVideo.src = isDark
        ? "https://videos.pexels.com/video-files/2882113/2882113-hd_1920_1080_24fps.mp4" // Nayi Dark Rain Video
        : "https://videos.pexels.com/video-files/3163534/3163534-hd_1920_1080_30fps.mp4"; // Nayi Neon Gaming Video
    menuVideo.onerror = function(){ this.remove(); }; // Na chale toh CSS wala hi dikhega!
    mainMenu.appendChild(menuVideo);

    const menuShade = document.createElement("div");
    menuShade.style.cssText = `position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.20), rgba(0,0,0,.75));z-index:-1;`;
    mainMenu.appendChild(menuShade);

    let finished=false;
    let renderer=null;
    let animationId=0;
    let audioCtx=null;
    let soundStarted=false;

    /* BACKGROUND */
    const bg=document.createElement("div");
    bg.style.cssText=`
        position:absolute;inset:-10%;
        background:radial-gradient(ellipse at 50% 45%,#43216b 0%,#160b2b 45%,#03020a 100%);
        transform:scale(1.1);
    `;
    intro.appendChild(bg);

    /* POSTER */
    const posterPreview=document.createElement("img");
    posterPreview.src="cc.png";
    posterPreview.alt="Nitin Danger";
    posterPreview.style.cssText=`
        position:absolute;width:min(88vw,58vh);height:min(88vh,150vw);
        object-fit:contain;left:50%;top:50%;
        transform:translate(-50%,-50%) scale(.55);
        filter:drop-shadow(0 0 30px #793dff);z-index:2;opacity:1;
    `;
    intro.appendChild(posterPreview);

    /* CANVAS */
    const canvas=document.createElement("canvas");
    canvas.style.cssText=`position:absolute;inset:0;width:100%;height:100%;z-index:3;`;
    intro.appendChild(canvas);

    /* LIGHTNING */
    const flash=document.createElement("div");
    flash.style.cssText=`position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;background:#c7d9ff;mix-blend-mode:screen;`;
    intro.appendChild(flash);

    const fxStyle=document.createElement("style");
    fxStyle.textContent=`
        @keyframes ndCinematicFlash { 0%,100%{opacity:0} 8%{opacity:.8} 16%{opacity:.08} 24%{opacity:.55} 35%{opacity:0} }
        @keyframes ndCloudDrift { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
    `;
    document.head.appendChild(fxStyle);

    function lightningFlash(){
        flash.style.animation="none"; void flash.offsetWidth;
        flash.style.animation="ndCinematicFlash .55s ease-out";
    }

    /* THUNDER - Wahi Purana */
    function startThunderSound(){
        if(soundStarted) return; soundStarted=true;
        try{
            const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
            audioCtx=new AC(); if(audioCtx.state==="suspended") audioCtx.resume();
            function thunder(){
                if(finished||!audioCtx) return;
                const duration=1.8, sr=audioCtx.sampleRate;
                const buf=audioCtx.createBuffer(1,sr*duration,sr); const d=buf.getChannelData(0);
                for(let i=0;i<d.length;i++){ const f=1-i/d.length; d[i]=(Math.random()*2-1)*f*f; }
                const src=audioCtx.createBufferSource(); src.buffer=buf;
                const filter=audioCtx.createBiquadFilter(); filter.type="lowpass"; filter.frequency.value=180;
                const gain=audioCtx.createGain(); gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(.48,audioCtx.currentTime+.12);
                gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
                src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                src.start(); src.stop(audioCtx.currentTime+duration);
            }
            thunder(); window.ndThunderTimer=setInterval(thunder,2600);
        }catch(e){}
    }
    function unlockSound(){ startThunderSound(); document.removeEventListener("pointerdown",unlockSound); document.removeEventListener("keydown",unlockSound); }
    document.addEventListener("pointerdown",unlockSound,{once:true});
    document.addEventListener("keydown",unlockSound,{once:true});
    /* ===== DARK BAADAL V4 - Dhuan Wala, Asli Jaisa! ===== */
    function darkCloudClose(){
        if(finished) return; finished=true;
        cancelAnimationFrame(animationId);
        clearInterval(window.ndThunderTimer);
        if(audioCtx) audioCtx.close().catch(()=>{});
        if(renderer) renderer.dispose();

        // SVG Filter - Isse baadal ka kinara phata-phata lagega, PNG jaisa nahi!
        const svgFilter = document.createElement("div");
        svgFilter.innerHTML = `
            <svg width="0" height="0" style="position:absolute">
                <filter id="ndCloudFilter">
                    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="7" result="noise"/>
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="90"/>
                    <feGaussianBlur stdDeviation="8"/>
                </filter>
            </svg>
        `;
        intro.appendChild(svgFilter);

        function makeCloud(side){
            const c = document.createElement("div");
            c.style.cssText = `
                position:absolute;top:-5%;bottom:-5%;width:75%;z-index:9999999;
                pointer-events:none;background:#000;opacity:.98;
                filter:url(#ndCloudFilter);
                transition:transform 1.3s cubic-bezier(.7,0,.3,1);
                ${side==='left' ? 'left:-5%;transform:translateX(-120%);' : 'right:-5%;transform:translateX(120%);'}
            `;
            // Andar dhuan - Alag-alag size ke dhabe
            c.innerHTML = `
                <div style="position:absolute;left:10%;top:10%;width:80%;height:30%;background:radial-gradient(ellipse, #2a2a35 0%, transparent 70%);filter:blur(15px)"></div>
                <div style="position:absolute;left:5%;top:40%;width:90%;height:35%;background:radial-gradient(ellipse, #15151f 0%, transparent 70%);filter:blur(20px)"></div>
                <div style="position:absolute;left:15%;top:65%;width:75%;height:30%;background:radial-gradient(ellipse, #0a0a12 0%, transparent 70%);filter:blur(18px)"></div>
            `;
            intro.appendChild(c);
            return c;
        }

        const leftCloud = makeCloud('left');
        const rightCloud = makeCloud('right');

        setTimeout(()=>{
            leftCloud.style.transform="translateX(0)";
            rightCloud.style.transform="translateX(0)";
        },100);

        setTimeout(()=>{
            intro.remove();
            mainMenu.style.display="flex";
            fxStyle.remove();
            mainMenu.animate([{opacity:0,transform:"scale(1.06)"},{opacity:1,transform:"scale(1)"}],{duration:600,fill:"forwards"});
        },1600);
    }

    /* THREE.JS - Wahi V2 Wala */
    function start3D(){
        if(!window.THREE) return;
        const THREE=window.THREE;
        try{
            const scene=new THREE.Scene();
            const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
            camera.position.set(0,1,9);
            renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:false,powerPreference:"high-performance"});
            renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
            renderer.setSize(innerWidth,innerHeight);
            renderer.outputEncoding=THREE.sRGBEncoding;
            scene.add(new THREE.AmbientLight(0xffffff,1.7));
            const goldLight=new THREE.DirectionalLight(0xffd49a,2.1); goldLight.position.set(-4,5,7); scene.add(goldLight);
            const purpleLight=new THREE.PointLight(0x813dff,3,25); purpleLight.position.set(-4,1,4); scene.add(purpleLight);
            const blueLight=new THREE.PointLight(0x168bff,3,25); blueLight.position.set(4,-2,4); scene.add(blueLight);
            const loader=new THREE.TextureLoader();
            loader.load("Cc.png",function(texture){
                if(finished) return;
                texture.encoding=THREE.sRGBEncoding;
                const aspect=texture.image.width/texture.image.height;
                const height=5.6; const width=height*aspect; const depth=.28;
                const geometry=new THREE.BoxGeometry(width,height,depth);
                const side=new THREE.MeshStandardMaterial({color:0x11101c,metalness:.85,roughness:.28,emissive:0x251047,emissiveIntensity:.35});
                const front=new THREE.MeshStandardMaterial({map:texture,roughness:.48,metalness:.18});
                const poster=new THREE.Mesh(geometry,[side,side,side,side,front,side]);
                poster.scale.setScalar(.25); poster.rotation.set(.3,-.8,0); scene.add(poster);
                const edge=new THREE.LineSegments(new THREE.EdgesGeometry(geometry), new THREE.LineBasicMaterial({color:0x9b75ff,transparent:true,opacity:.95}));
                poster.add(edge);
                const count=180; const positions=new Float32Array(count*3);
                for(let i=0;i<count;i++){ positions[i*3]=(Math.random()-.5)*8; positions[i*3+1]=(Math.random()-.5)*10; positions[i*3+2]=(Math.random()-.5)*4; }
                const pGeo=new THREE.BufferGeometry(); pGeo.setAttribute("position", new THREE.BufferAttribute(positions,3));
                const pMat=new THREE.PointsMaterial({color:0x8fcaff,size:.045,transparent:true,opacity:.85,blending:THREE.AdditiveBlending});
                const particles=new THREE.Points(pGeo,pMat); scene.add(particles);
                const start=performance.now();
                function animate(){
                    if(finished) return;
                    animationId=requestAnimationFrame(animate);
                    const t=(performance.now()-start)/1000;
                    const grow=Math.min(t/1.8,1); const ease=1-Math.pow(1-grow,3);
                    poster.scale.setScalar(.25+ease*.78);
                    poster.rotation.y=-.8 + Math.sin(t*.72)*.52;
                    poster.rotation.x=.3 + Math.sin(t*.9)*.19;
                    poster.rotation.z=Math.sin(t*.55)*.045;
                    poster.position.y=Math.sin(t*1.1)*.10;
                    const angle=t*.52;
                    camera.position.x=Math.sin(angle)*.9;
                    camera.position.y=Math.sin(t*.65)*.28;
                    camera.position.z=8.5-Math.sin(t*.8)*.65;
                    camera.lookAt(0,0,0);
                    particles.rotation.y=t*.08;
                    particles.rotation.x=Math.sin(t*.3)*.08;
                    purpleLight.intensity=2.5+Math.sin(t*4)*.8;
                    blueLight.intensity=2.5+Math.sin(t*3.5)*.8;
                    renderer.render(scene,camera);
                }
                posterPreview.style.opacity="0";
                animate();
            });
        }catch(e){ console.error(e); }
    }

    function loadThree(){
        if(window.THREE){ start3D(); return; }
        const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
        s.onload=start3D; document.head.appendChild(s);
    }

    loadThree();
    const lightningTimer=setInterval(lightningFlash,1700);

    // 5.2 Sec Intro, Phir Dark Baadal Close!
    setTimeout(()=>{
        clearInterval(lightningTimer);
        darkCloudClose();
    },5200);

})();

</script>
